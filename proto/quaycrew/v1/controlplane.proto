syntax = "proto3";

package quaycrew.v1;

import "google/protobuf/timestamp.proto";
import "quaycrew/v1/events.proto";

// A workspace is the runtime unit of isolation. Created through this API, never stored in the repo.
message Workspace {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

// A channel attached to a workspace (for example a Telegram bot).
message Channel {
  string workspace = 1;
  string id = 2;
  string kind = 3;
}

// A project is a body of work inside a workspace. Sessions happen inside a project, and share the
// context the project carries.
message Project {
  string id = 1;
  string workspace = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  // deploy_target is where this body of work ships. Unset on a project that has not said, which is
  // every project until somebody does.
  DeployTarget deploy_target = 5;
  // repository is where this project's work lands, written owner/name. Work declared here that
  // names no repository of its own works in this one, so where the work goes is a row rather than an
  // argument somebody has to remember to pass.
  string repository = 6;
  // visibility is what kind of repository that is: "public" or "private". It is a cost fact. A
  // pipeline's minutes are free on a public repository and metered on a private one, and that
  // decision was being taken in a person's head, once per project.
  //
  // It is what the operator declared, not what the forge says. The system does not go and look.
  string visibility = 7;
}

// DeployTarget is where a project ships: the cloud account, the region inside it, and the identity a
// pipeline assumes to get there.
//
// It is one message rather than three fields on the project because a target is whole or it is
// absent. Half of one reads as an answer to "where does this go" and is not one, and the cost of
// believing it is a crew that writes correct infrastructure for an account it can never
// reach.
message DeployTarget {
  // account is the cloud account, twelve digits.
  string account = 1;
  // region is where inside it, for example "eu-west-2".
  string region = 2;
  // identity is the role a pipeline assumes to deploy, and it belongs to the account above. The
  // control plane refuses a target whose identity names a different one, because pasting the role
  // from the other account is invisible until a pipeline runs.
  string identity = 3;
}

// A session is one conversation inside a project: the operator's word for what the control plane
// runs as a session in a sandbox. It carries its workspace too, denormalised from the project so a
// listing does not need a join; a project never moves workspace.
message Session {
  // id is the system's own identifier for this session. It names the session's sandbox container.
  string id = 1;
  string workspace = 2;
  // handle is the name a channel dispatches to: dispatch to the same handle and the conversation
  // continues. It is chosen by whoever starts the session, or minted when nobody did.
  string handle = 3;
  // status is where the session is: "idle" when it is waiting for you, "running" while an exec is under
  // way, "failed" when the last exec did not land, "reclaimed" when the system took its container back,
  // and "stopped" when the session was put down.
  string status = 4;
  // model_session_id is the model's own identifier for the conversation, in the model's own word,
  // used to resume it.
  string model_session_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string project = 8;
  // archived_at is when the session was put away. Unset means it is live. Archiving hides a session
  // from the default listing and deletes nothing, so this is reversible by clearing it.
  google.protobuf.Timestamp archived_at = 9;
  // permission_mode is what the model is allowed to do without asking, for this session's execs:
  // "plan", "acceptEdits" or "bypassPermissions". It belongs to the session rather than to an exec, so
  // a session started to plan something keeps planning.
  string permission_mode = 10;
  // driver says this session drives the system rather than doing work inside it. It reaches the
  // control plane's own interface, and whatever host paths the operator handed it, which an
  // ordinary session does not.
  bool driver = 11;
  // usage is what this session's conversation has cost so far, read from the transcript the model
  // keeps. Unset for a session nobody has spoken in.
  Usage usage = 12;
  // stale says this session's live sandbox was born before the workspace's current skill set, so it
  // does not hold what a fresh one would. A sandbox is born with its capabilities and never
  // drifts; restarting the session builds a new one, born current. A stopped session is never
  // stale, because its next sandbox is born with the current set.
  bool stale = 13;
  // label is what the operator calls this conversation, empty until they say. Nothing automatic ever
  // writes it: a name somebody picked is the one thing in a listing that is certainly right.
  string label = 14;
  // description is what the system observed the conversation to be, one line, written by the model that
  // had the exec. Empty until an exec has happened. A listing prefers the label when there is one.
  string description = 15;
  // described_at_exec is how many execs the session had when its description was written, so a
  // conversation that has moved on can be described again. Zero means never described.
  int32 described_at_exec = 16;
  // context_window is how full the model's context window is. Absent where the system cannot say.
  ContextWindow context_window = 17;
  // 18 was role, the name of the role a session ran as. Roles are gone: a session holds its
  // workspace's skills and hooks and nothing narrows it.
  reserved 18;
  // reclaimed_at is when the system took this session's container back. Unset means it holds one, or
  // never had one taken. The row, the conversation handle and the files on the host all stay, so the
  // next exec builds a fresh container over the same state and the conversation carries on.
  //
  // It is a stamp of its own rather than a reading of updated_at, because how long a session has been
  // reclaimed is what the archive time is measured against, and updated_at moves on every write.
  google.protobuf.Timestamp reclaimed_at = 19;
  // presence is what the system found inside this session's sandbox, and it is the half of "is anything
  // happening here" that status never knew. status only says whether a dispatched exec is open, so a
  // session holding a conversation somebody started by hand read idle, and idle is the word that
  // invites a restart, a drain or a reclaim.
  //
  // Set only when the request asked for it, because the answer costs a question to the sandbox. Unset
  // means nobody asked, which is not the same as nothing being there.
  SessionPresence presence = 20;
  // title is the name the session was dispatched with, written when the session is made and never
  // afterwards, so a listing says which conversation is which from the first second rather than once
  // a description is written behind an exec that has landed.
  //
  // It is a third name rather than a second use of label, because the two are typed at different
  // moments about different things: the title names what the session was made for, and the label is
  // what the operator calls this conversation once they have seen it. A dispatch that has to be made
  // again would put the title back over a label the operator set in the meantime.
  string title = 21;
  // context_spend is where this session's context went, by category. Absent where the system cannot
  // say, which is a conversation nobody has spoken in.
  ContextSpend context_spend = 22;
}

// ContextSpend is where a session's context went, in characters, by category.
//
// context_window says how full the window is, and a share on its own moves nothing: a session at
// eighty per cent filled up on the code it had to read, on tool output it read once, or on its own
// repeated attempts. This says which.
//
// Characters and not tokens. The transcript holds text, every model counts tokens its own way, and a
// token count worked out here would be a made up number sitting beside the real one in
// context_window. A reader that wants tokens has both numbers and the ratio measured in
// docs/CONTEXT-SPEND.md.
//
// The four add up to the whole of what the accounting saw, so nothing is dropped between the parts
// and the total. What no transcript holds, the system prompt and the definitions of every tool the
// session carries, is in neither: the measurement in docs/CONTEXT-SPEND.md says how large that part
// is.
message ContextSpend {
  // reads is the contents of files, however the session opened them: with a reading tool, or with a
  // reading command in the shell.
  int64 reads = 1;
  // tools is what every other tool returned: a search, a page fetched, the answer of a sub agent, and
  // every shell command that was not printing a file.
  int64 tools = 2;
  // turns is the session's own words: what it wrote, what it thought, and the calls it made.
  int64 turns = 3;
  // told is what reached the session from outside a tool: the exec it was given, and the answers to
  // its questions.
  int64 told = 4;
}

// SessionPresence is what is inside a session's sandbox right now, read from the sandbox itself
// rather than from anything the system wrote down.
//
// Read from the sandbox because a stamp needs somebody to keep it fresh, how often is a number, and
// no measurement has set one. The sandbox already knows: its own process table says whether a model
// runtime is up, and its own tmux says whether a client is on the conversation.
//
// The order matters to a reader. Anything but EMPTY means something in that container is somebody's,
// so a caller deciding whether to take a container away treats every other value as "leave it alone".
enum SessionPresence {
  // Nobody asked. It is not an answer, and a caller that reads it as "nothing is there" is making
  // the mistake this field exists to stop.
  SESSION_PRESENCE_UNSPECIFIED = 0;
  // The system asked and found nothing: no model runtime, and nobody attached. The only real idle.
  SESSION_PRESENCE_EMPTY = 1;
  // A model runtime is up inside the sandbox with nobody watching it. A conversation somebody
  // started and walked away from is here, and so is one still answering.
  SESSION_PRESENCE_AWAKE = 2;
  // Somebody has the conversation open.
  SESSION_PRESENCE_ATTACHED = 3;
  // The system asked and could not be told: the daemon did not answer. Never idle, because a caller
  // reads idle as licence to close a container.
  SESSION_PRESENCE_UNTOLD = 4;
}

// ContextWindow is how full a conversation's context window is.
//
// This is the model's context window, not the system's context documents. It is the number that says
// whether a conversation is still worth continuing, and it is not the same thing as what the
// conversation has cost: cost only grows, while the window empties again when the model compacts.
message ContextWindow {
  // used is what the next exec carries: everything sent on the last answer, including what was read
  // back from the cache, because that is the context rather than the part of it charged as new. Read
  // from the transcript the model keeps.
  int64 used = 1;
  // size is how big the window is. The system cannot work that out for itself, so this is what the
  // model runtime last told a session in this workspace. Zero where nothing has told it yet, which a
  // listing shows as a count rather than as a guessed share.
  int64 size = 2;
  // ceiling is the share of the window past which this workspace gives a session no new exec, so a
  // client says what the number means rather than working it out from a limit of its own. Zero where
  // the system did not say, and a client that reads zero marks nothing.
  int32 ceiling = 3;
}

// Usage is what a conversation has cost, in tokens.
//
// Four numbers rather than two. On a real conversation the input was 52 tokens and the cache read was
// 1,723,404, because almost everything sent is the context being read again on every exec: reporting
// only what was sent and what came back would show the 52 and hide the rest.
message Usage {
  // input is what was sent and charged as new, not counting anything served from the cache.
  int64 input = 1;
  // output is what came back.
  int64 output = 2;
  // cache_read is context the model read from its cache rather than being sent again.
  int64 cache_read = 3;
  // cache_written is context put into the cache to be read on later execs.
  int64 cache_written = 4;
}

message CreateWorkspaceRequest {
  string name = 1;
}
message CreateWorkspaceResponse {
  Workspace workspace = 1;
}
message GetWorkspaceRequest {
  string id = 1;
}
message GetWorkspaceResponse {
  Workspace workspace = 1;
}
message ListWorkspacesRequest {}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}
message DeleteWorkspaceRequest {
  string id = 1;
}
message DeleteWorkspaceResponse {}

message CreateProjectRequest {
  string workspace = 1;
  string name = 2;
}
message CreateProjectResponse {
  Project project = 1;
}
message GetProjectRequest {
  string id = 1;
}
message GetProjectResponse {
  Project project = 1;
}
// ListProjectsRequest lists every project when workspace is empty, or one workspace's when set.
message ListProjectsRequest {
  string workspace = 1;
}
message ListProjectsResponse {
  repeated Project projects = 1;
}
// SetDeployTargetRequest declares where a project ships. An unset target clears what was declared,
// so a wrong account is undone through the same door it was written through.
message SetDeployTargetRequest {
  string project = 1;
  DeployTarget target = 2;
}
message SetDeployTargetResponse {
  Project project = 1;
}
message DeleteProjectRequest {
  string id = 1;
}
message DeleteProjectResponse {}

// SetProjectRepositoryRequest records where a project's work lands. Sending it again replaces what
// is held, so a project that moved repository is corrected with the same command.
message SetProjectRepositoryRequest {
  string project = 1;
  string repository = 2;
  // visibility is "public" or "private". Empty is public, because free pipeline minutes are the
  // cheaper of the two and a project that cannot be public is the one that has to say so.
  string visibility = 3;
}
message SetProjectRepositoryResponse {
  Project project = 1;
}

message AttachChannelRequest {
  string workspace = 1;
  string id = 2;
  string kind = 3;
}
message AttachChannelResponse {
  Channel channel = 1;
}

// SecretProjection is how a secret reaches a sandbox. The store holds bytes under a name and knows
// nothing else about them; how they are presented is a separate choice, which is the shape Kubernetes
// and Docker both settled on.
//
// Unspecified reads as the environment, so a client written before this existed still sets the
// secrets it always set.
enum SecretProjection {
  SECRET_PROJECTION_UNSPECIFIED = 0;
  // The value becomes an environment variable named after the secret.
  SECRET_PROJECTION_ENV = 1;
  // The value becomes a file, and does not reach the environment at all.
  SECRET_PROJECTION_FILE = 2;
}

// SetSecretRequest carries a secret value that is stored in the secrets backend, never returned.
message SetSecretRequest {
  // workspace is the workspace it belongs to, and is ignored when scope is "system".
  string workspace = 1;
  string key = 2;
  string value = 3;
  SecretProjection projection = 4;
  // scope is "workspace", which is what an empty value means, or "system". A secret set on the system
  // reaches every workspace, including the ones made after it, which is the difference between
  // setting a shared token once and setting it again for each workspace. A workspace that sets the
  // same name keeps its own value.
  string scope = 5;
}
message SetSecretResponse {}

// DispatchRequest starts a new session (handle empty) or continues an existing one.
message DispatchRequest {
  string project = 1;
  string handle = 2;
  string text = 3;
  // permission_mode is what the session's execs may do without asking, and it applies from this exec
  // on: "plan", "acceptEdits" or "bypassPermissions". Empty leaves the session as it is, which is what
  // every caller that does not care sends.
  //
  // It travels with the dispatch that starts a session because a sandbox is born with its
  // capabilities and never drifts. Starting a session and then changing its mode costs a restart.
  string permission_mode = 4;
  // detach answers as soon as the session exists and runs the exec behind the answer. The reply comes
  // back empty, because there is not one yet: the session reads "running" until the exec lands, and
  // its execs say what came back.
  //
  // It is what a surface that draws a screen needs. An exec takes minutes, and a caller that waits
  // for one is a caller that is not drawing anything. The console
  // waited, gave up at thirty seconds, and left a session whose conversation never happened.
  bool detach = 5;
  // 6 was role and 7 was the job this exec ran for. Both are gone with the job subsystem.
  reserved 6, 7;
  // title is what to call the session this dispatch makes, and it is read only when the session is
  // made: a name a caller sends with every exec must not overwrite what the operator has called the
  // conversation since.
  //
  // It is what a caller that already knows the name sends. Without it the system is handed that name
  // and drops it, which leaves a listing waiting for a description written after the work is over.
  string title = 8;
  // 9 was the execution this exec ran, which is gone with the job subsystem.
  reserved 9;
}
message DispatchResponse {
  string id = 1;
  string handle = 2;
  // reply is what the model said, and is empty when the request detached: the exec is still running,
  // so there is nothing to say yet.
  string reply = 3;
}

// ListSessionsRequest filters by project when set, else by workspace when set, else lists all.
// OpenDriverRequest asks for a project's driver, the session that drives the system.
message OpenDriverRequest {
  string project = 1;
}
message OpenDriverResponse {
  Session session = 1;
}

message ListSessionsRequest {
  string workspace = 1;
  string project = 2;
  // archived lists the sessions that have been put away instead of the live ones. The two are never
  // mixed: a listing is one or the other, because the default view must not quietly grow the sessions
  // somebody deliberately hid.
  bool archived = 3;
  // presence asks each session's own sandbox what is in it, so a listing can tell a session holding a
  // live conversation from one holding nothing at all.
  //
  // It costs one question to the sandbox per row that would otherwise read idle, so it is asked for
  // rather than always done: the surfaces an operator reads set it, and the machinery that resolves
  // an address or finds a session by name does not pay for it.
  bool presence = 4;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
}
message GetSessionRequest {
  string id = 1;
}
message GetSessionResponse {
  Session session = 1;
}
// AttachSessionRequest asks how to get inside a session's conversation.
message AttachSessionRequest {
  string id = 1;
}
// AttachSessionResponse describes the command that opens the conversation, and deliberately carries
// no credential: the operator's own environment supplies that.
message AttachSessionResponse {
  // sandbox is the container the session runs in.
  string sandbox = 1;
  // argv is the command to run inside it, for example ["claude", "--resume", "<conversation id>"].
  repeated string argv = 2;
}

message StopSessionRequest {
  string id = 1;
}
message StopSessionResponse {}

// DrainSessionsRequest puts every live session down, so whatever is about to take the containers
// away finds nothing running. `make upgrade` removes them by name from the daemon, which ends an exec
// in flight as "exit status 137" and leaves the row saying it was born holding skills its next
// container will not have.
message DrainSessionsRequest {
  // force drains even when an exec is under way. Without it an exec in flight refuses the drain, and
  // the answer names what is working so the operator can wait for it instead.
  bool force = 1;
}
message DrainSessionsResponse {
  // stopped is what went down, so the caller can say what it did rather than a count.
  repeated Session stopped = 1;
  // working is what was under way. Empty unless force was given: without it the drain refuses.
  repeated Session working = 2;
}

// RestartSessionRequest brings a stopped session back.
message RestartSessionRequest {
  string id = 1;
}
// RestartSessionResponse carries the session as it now is, idle and with a sandbox running, so the
// caller does not have to read it back to find out what happened.
message RestartSessionResponse {
  Session session = 1;
}

// ArchiveSessionRequest puts a session away: stops it if it is running, hides it from the default
// listing, and keeps everything.
message ArchiveSessionRequest {
  string id = 1;
}
message ArchiveSessionResponse {
  Session session = 1;
}

// ReclaimSessionRequest takes a settled session's container back and leaves everything else.
//
// It is the controller's move rather than an operator's, and it is not a stop. A stop is somebody's
// decision and reads as one; a reclaim is the system saving memory on a session nobody is using, and
// the next exec to arrive builds a fresh container over the same conversation and the same files.
//
// A session with an exec under way is refused, and so is one an operator already stopped: overwriting
// a decision with bookkeeping is how a stop stops meaning anything.
message ReclaimSessionRequest {
  string id = 1;
}
message ReclaimSessionResponse {
  Session session = 1;
}

// StopExecRequest halts the exec a session is running now and keeps the reason.
//
// The session survives: its conversation, its container and its history all stay, so the next
// dispatch continues it. That is the difference between this and StopSession, which puts the whole
// session down and takes its container away.
//
// The exec reads "stopped" with the reason rather than "failed". An operator asking for a stop is
// not a fault, and a stop that reports as a crash hides the real crashes.
message StopExecRequest {
  string id = 1;
  // reason is what to record against the exec, in the operator's own words. Empty records that
  // somebody stopped it and nothing about why.
  string reason = 2;
}
message StopExecResponse {
  // stopped says whether there was an exec to stop. False means nothing was running, which is not a
  // failure: the caller asked for a state the session is already in.
  bool stopped = 1;
  // session is the session as it now is, so the caller does not read it back.
  Session session = 2;
}

// ContextDir is a directory of files the model reads, kept on the host and mounted into every sandbox
// for its scope. Editing context is editing files, so what matters is where they are.
message ContextDir {
  // scope is "workspace" or "project".
  string scope = 1;
  // name is what that workspace or project is called.
  string name = 2;
  // host is the directory on the machine running the sandboxes, which is where it is edited.
  string host = 3;
  // sandbox is where the same directory appears inside a session's container.
  string sandbox = 4;
  // memory is the file the model reads as its memory for this scope, inside host.
  string memory = 5;
  // written says whether anything has been written at this scope. An empty directory is the normal
  // state and says nothing about whether context is set up, so this is the difference worth showing.
  bool written = 6;
  // owner is what to name when setting this context: a workspace or project identifier, and empty
  // for the system.
  string owner = 7;
  // body is what the model is told at this scope. It comes from the store, which is where context
  // lives; the file in a sandbox is a rendering of it.
  string body = 8;
}

// SetContextRequest records what the model should be told at a scope. The system's context has no
// owner; a workspace's and a project's are owned by their identifier.
message SetContextRequest {
  // scope is "system", "workspace" or "project".
  string scope = 1;
  string owner = 2;
  string body = 3;
}
message SetContextResponse {
  ContextDir dir = 1;
}

// Design is what a project is for and what was designed for it. A project with no design row answers
// with a Design carrying only its project identifier, which is the normal state.
//
// The field numbers follow the order the slices add them, not the order the design document lists
// them. A field number is fixed once it ships, so a later change appends rather than renumbers.
message Design {
  string project = 1;
  // brief is what the project is for, one paragraph.
  string brief = 2;
  // body is the design document, whole, in markdown.
  string body = 3;
  // approved is the operator's word on this exact body. Any write to body clears it, in the same
  // write, because a design that changed is a design nobody has agreed to yet.
  bool approved = 4;
  google.protobuf.Timestamp approved_at = 5;
  // written_by is the session that last wrote body, empty when the operator wrote it. It is what the
  // caller claimed, never what the system authenticated, and it grants nothing.
  string written_by = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message GetDesignRequest {
  string project = 1;
}
message GetDesignResponse {
  Design design = 1;
}

// SetBriefRequest records what a project is for. No length refuses a brief: a long one warns and is
// kept whole.
message SetBriefRequest {
  string project = 1;
  string brief = 2;
}
message SetBriefResponse {
  Design design = 1;
  repeated string warnings = 2;
}

// SetDesignRequest records the design document, whole. No length refuses a body.
message SetDesignRequest {
  string project = 1;
  string body = 2;
  string written_by = 3;
}
message SetDesignResponse {
  Design design = 1;
  repeated string warnings = 2;
}

// ApproveDesignRequest records the operator's word on the design as it stands. A design with no body
// is refused: there is nothing to agree to.
message ApproveDesignRequest {
  string project = 1;
}
message ApproveDesignResponse {
  Design design = 1;
}

// Step is one step of a project's path: one atomised change, with what proves it.
//
// The field numbers follow the order the slices add them, not the order the design document lists
// them. A field number is fixed once it ships, so a later change appends rather than renumbers.
message Step {
  string project = 1;
  // number is where in the path this step sits, counting from one. Numbers need not run without
  // gaps, so a path may go 1, 2, 5.
  int32 number = 2;
  // title is one line, one intention.
  string title = 3;
  // intention is what changes and why, in the words a stranger needs.
  string intention = 4;
  // touches is the files this step writes, one per line.
  string touches = 5;
  // proof is what proves it, and the value it delivers, in prose.
  string proof = 6;
  // after is the step number this one waits for. Zero means nothing blocks it.
  int32 after = 7;
  // state is one of ready, taken, done, stopped.
  string state = 8;
  // session is the session that took it, empty until somebody takes it.
  string session = 9;
  // result is what somebody wrote that the step produced, or why it stopped.
  string result = 10;
  google.protobuf.Timestamp taken_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  // proof_scenario is the exact name of the scenario that proves it, as the feature file writes it.
  // This is what krewe runs.
  string proof_scenario = 13;
}

// SetPathRequest carries the path document, in the grammar the control plane parses. The document is
// sent whole rather than parsed by the caller, so the console and the command line send the same
// words and cannot drift.
message SetPathRequest {
  string project = 1;
  string document = 2;
}
message SetPathResponse {
  repeated Step steps = 1;
  repeated string warnings = 2;
}

// ListStepsRequest reads a project's path, or every project's when it names none.
message ListStepsRequest {
  string project = 1;
}
message ListStepsResponse {
  repeated Step steps = 1;
}

// TakeStepRequest gives one step of a project's path to a session that starts now.
message TakeStepRequest {
  string project = 1;
  int32 number = 2;
}
// TakeStepResponse says what was taken, which session took it, and what that session was asked to do.
//
// The text is carried back so a caller can show what the session was given without a second call. It
// is composed by the control plane, so the console and the command line send the same words.
message TakeStepResponse {
  Step step = 1;
  Session session = 2;
  string text = 3;
  repeated string warnings = 4;
}

// Feature is one narrowed part of a project. A project delivers several at the same time, each with
// its own milestones, and none of them waits for another.
//
// It carries no approval field, because an approval belongs to the project: a step taken in any
// feature reads the one approval on the project's design.
message Feature {
  string id = 1;
  string project = 2;
  // number is where in the project this feature sits, counting from one. The server gives it, and a
  // number is never reused.
  int32 number = 3;
  // title is one line.
  string title = 4;
  // intention is one line saying which part of the project this feature narrows to.
  string intention = 5;
  // state is one of open, done, stopped.
  string state = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ListFeaturesRequest reads a project's features, or every project's when it names none.
message ListFeaturesRequest {
  string project = 1;
}
message ListFeaturesResponse {
  repeated Feature features = 1;
}

// AddFeatureRequest adds one narrowed part to a project. The caller never chooses the number.
message AddFeatureRequest {
  string project = 1;
  string title = 2;
}
message AddFeatureResponse {
  Feature feature = 1;
}

// SetFeatureIntentionRequest says which part of the project a feature narrows to, in one line.
message SetFeatureIntentionRequest {
  string feature = 1;
  string intention = 2;
}
message SetFeatureIntentionResponse {
  Feature feature = 1;
  repeated string warnings = 2;
}

// SessionWorkEntry is one thing in a session's work: a file or a directory, with the size of a file.
message SessionWorkEntry {
  string name = 1;
  bool directory = 2;
  int64 size = 3;
}

// ReadSessionWorkRequest reads what a session made, out of the directory the system keeps for it.
//
// It never enters the container. The work is a bind mount the system already holds, so this answers
// for a session whose sandbox has gone as readily as for one that is running, which is the whole
// point: work a session finished must reach somebody without a person carrying it out of a container.
message ReadSessionWorkRequest {
  string session = 1;
  // path is what to read, relative to the session's work. Empty reads the work itself, which is how
  // a caller finds out what is in there before naming a file.
  string path = 2;
}
message ReadSessionWorkResponse {
  // host is the directory on the machine running the sandboxes, which is the path an operator opens.
  string host = 1;
  // path is what was read, relative to the work, and empty for the work itself.
  string path = 2;
  bool directory = 3;
  // content is the bytes of a file, and empty for a directory.
  bytes content = 4;
  // entries is what a directory holds, sorted by name, and empty for a file.
  repeated SessionWorkEntry entries = 5;
}

// DirectoryKind says which of the system's two directories an answer names.
enum DirectoryKind {
  DIRECTORY_KIND_UNSPECIFIED = 0;
  // The workspace's shared folder, which every session in that workspace reads.
  DIRECTORY_KIND_SHARED = 1;
  // One session's own working directory.
  DIRECTORY_KIND_WORKING = 2;
}

// LocateDirectoryRequest asks where an address is on the machine, so a person can put a file in it by
// hand.
//
// It answers with nothing running. The layout belongs to the system rather than to the tool, and the
// case that has no answer today is the one where every sandbox is gone: reading a bind mount off a
// live container needs a live container.
message LocateDirectoryRequest {
  // workspace is the workspace id, and is required: every directory this answers for is inside one.
  string workspace = 1;
  // project is the project id, and narrows session to the project holding it.
  string project = 2;
  // session is the session handle. With one, the answer is that session's own working directory;
  // without one, it is the workspace's shared folder.
  string session = 3;
}
message LocateDirectoryResponse {
  // host is the directory on the machine running the sandboxes, which is where a person puts a file.
  // It is made if it is not there, because a path nobody can copy into is not an answer.
  string host = 1;
  // sandbox is where the same directory appears inside a container, which is what a session calls the
  // file once it is in there.
  string sandbox = 2;
  // kind says which of the two directories this is.
  DirectoryKind kind = 3;
}

// SecretRef names a secret a workspace has set. It carries no value and there is no call that returns
// one: a value the backend holds must not become readable because a client asked politely. The only
// reader is the system itself, at the moment an exec needs it.
message SecretRef {
  string workspace = 1;
  // workspace_name is what to call that workspace where a human reads it.
  string workspace_name = 2;
  string name = 3;
  google.protobuf.Timestamp updated_at = 4;
  // projection is how this one reaches a sandbox. Where it lands is not carried, because it is
  // derived from the name and every reader would derive the same path.
  SecretProjection projection = 5;
  // system says the system holds this one, so every workspace reads it without setting anything. Its
  // workspace is then empty, because it belongs to no single workspace.
  bool system = 6;
}

// ListSecretsRequest lists what one workspace has set, or every workspace's when it is empty. The
// system's own are in both answers, marked, because they reach every workspace either way.
message ListSecretsRequest {
  string workspace = 1;
}
message ListSecretsResponse {
  repeated SecretRef secrets = 1;
}

// A skill is a capability a session can be given: a brief the model reads, the binaries it needs and
// the secrets it names. It is authored as a directory in a git repository and imported here, pinned to
// a version, so a skill edited in its repository cannot change a session that is already using it.
//
// It carries no secret value and no brief. The brief is a file, and a listing of what a system can do
// should not be a page per entry.
message Skill {
  string name = 1;
  int32 version = 2;
  // summary says when to reach for this skill, in a sentence. It is the line a session is told.
  string summary = 3;
  // binaries are the commands the skill needs in the sandbox image. A session missing one is refused
  // before an exec runs.
  repeated string binaries = 4;
  repeated SkillSecret secrets = 5;
  google.protobuf.Timestamp imported_at = 6;
  // system says the system holds this skill, so every workspace has it without attaching anything.
  bool system = 8;
  // left_out says why a skill the workspace holds is not given to its sessions, and is empty when it
  // is given. A skill naming a secret the workspace has not set is held and not given, rather than
  // refusing the exec, so one unusable skill cannot stop every conversation in the workspace.
  string left_out = 7;
}

// SkillSecret names a secret a skill needs and says what it is for. Never a value: a value written into
// a skill file is a value in a git repository.
message SkillSecret {
  string name = 1;
  // purpose says which credential to go and get, and how to set it, for whoever reads a refusal.
  string purpose = 2;
}

// SkillFile is one file of a skill's directory, on its way into the system.
message SkillFile {
  // path is relative to the skill's directory, with forward slashes.
  string path = 1;
  bytes body = 2;
  // executable says the file has to be runnable, which a setup script is and nothing else is assumed
  // to be.
  bool executable = 3;
}

// ImportSkillRequest carries a skill's whole directory.
//
// The files travel rather than the path, because the control plane runs in a container and a directory
// on the operator's machine means nothing to it. The client reads and sends; this side parses,
// validates and refuses, so there is one validator rather than one per client.
message ImportSkillRequest {
  repeated SkillFile files = 1;
}
message ImportSkillResponse {
  Skill skill = 1;
}

// ListSkillsRequest lists what the system has imported, what one workspace holds when workspace is
// set, or what one session actually holds when session is set: the same answer the session's sandbox
// is built from, both the system's own skills and the workspace's, the workspace winning a name
// collision.
message ListSkillsRequest {
  string workspace = 1;
  string session = 2;
}
message ListSkillsResponse {
  repeated Skill skills = 1;
}

// AttachSkillRequest gives a workspace a skill, at the version the system holds now. Every session in the
// workspace then holds it.
message AttachSkillRequest {
  // workspace is the workspace to give it to, and is ignored when scope is "system".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "system". A skill attached to the
  // system is held by every workspace, including the ones made after it, which is the difference
  // between setting a system up once and setting each workspace up again.
  string scope = 3;
}
message AttachSkillResponse {
  Skill skill = 1;
}

// DetachSkillRequest takes a skill away from a workspace. The skill stays imported.
message DetachSkillRequest {
  // workspace is the workspace to take it from, and is ignored when scope is "system".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "system".
  string scope = 3;
}
message DetachSkillResponse {}

// Hook is a constraint a session runs under: what it may not do, checked when it tries. It is never
// read by the model, which is why there is no brief here and a skill has one.
message Hook {
  string name = 1;
  int32 version = 2;
  // summary is the line a listing shows. Nothing pays for it per exec, because a hook is invisible
  // to the model until it fires.
  string summary = 3;
  // events are what this hook fires on, in the order they were written, which is the order they are
  // rendered into a session's settings.
  repeated HookBinding events = 4;
  // binaries are the commands the hook needs in the sandbox image. A session missing one is refused
  // before an exec runs.
  repeated string binaries = 5;
  repeated SkillSecret secrets = 6;
  google.protobuf.Timestamp imported_at = 7;
  // system says the system holds this hook, so every workspace has it without attaching anything. It is
  // the level most hooks want: a constraint the system agreed on is not usually a per workspace
  // opinion.
  bool system = 8;
  // left_out says why a hook the workspace holds is not given to its sessions, and is empty when it
  // is given.
  string left_out = 9;
}

// HookBinding is one event a hook fires on.
message HookBinding {
  // on is the event the runtime raises, for example "PreToolUse" or "UserPromptSubmit". A name the
  // runtime never raises is refused at import, because a hook that is never called cannot be told
  // from one that approves of everything.
  string on = 1;
  // matcher is which tools this fires for, empty for every tool. Only PreToolUse and PostToolUse
  // fire per tool.
  string matcher = 2;
  // entry is the executable to run, relative to the hook's own directory.
  string entry = 3;
  // timeout_seconds is how long the runtime waits. Zero means the runtime's own default.
  int32 timeout_seconds = 4;
}

// HookFile is one file of a hook's directory.
message HookFile {
  // path is relative to the hook's directory, with forward slashes.
  string path = 1;
  bytes body = 2;
  // executable says the file has to be runnable, which an entry point is.
  bool executable = 3;
}

// ImportHookRequest carries a hook's whole directory, for the same reason ImportSkillRequest does:
// the control plane runs in a container where a path on the operator's machine means nothing.
message ImportHookRequest {
  repeated HookFile files = 1;
}
message ImportHookResponse {
  Hook hook = 1;
}

// ListHooksRequest lists what the system has imported, what one workspace holds when workspace is set,
// or what one session actually holds when session is set.
message ListHooksRequest {
  string workspace = 1;
  string session = 2;
}
message ListHooksResponse {
  repeated Hook hooks = 1;
}

// AttachHookRequest gives a workspace a hook, at the version the system holds now.
message AttachHookRequest {
  // workspace is the workspace to give it to, and is ignored when scope is "system".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "system".
  string scope = 3;
}
message AttachHookResponse {
  Hook hook = 1;
}

// DetachHookRequest takes a hook away from a workspace. The hook stays imported.
message DetachHookRequest {
  // workspace is the workspace to take it from, and is ignored when scope is "system".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "system".
  string scope = 3;
}
message DetachHookResponse {}

// ListContextsRequest asks where context lives: for one project when set, or for the whole system.
message ListContextsRequest {
  string project = 1;
}
message ListContextsResponse {
  repeated ContextDir dirs = 1;
}

// SetSessionPermissionModeRequest changes what a session's execs may do without asking.
message SetSessionPermissionModeRequest {
  string id = 1;
  // mode is "plan", "acceptEdits" or "bypassPermissions". An unknown one is refused rather than
  // passed to the model, which would take it as far as its own argument parser and no further.
  string mode = 2;
}
message SetSessionPermissionModeResponse {
  Session session = 1;
}
message SetSessionLabelRequest {
  string id = 1;
  // label is what to call this conversation. Empty clears it, which is the only way back to the
  // identifier, so it is a value rather than an absence.
  string label = 2;
}
message SetSessionLabelResponse {
  Session session = 1;
}

// RestoreSessionRequest brings an archived session back into the default listing.
message RestoreSessionRequest {
  string id = 1;
}
message RestoreSessionResponse {
  Session session = 1;
}

// GetInfoRequest asks what this control plane is running.
message GetInfoRequest {}
// GetInfoResponse says what an exec dispatched here would actually do.
//
// It carries configuration, never a secret and never a health verdict. The console shows it so the
// operator can see which system they are about to act on, the way a cluster name does.
message GetInfoResponse {
  // model is the backend an exec runs against, for example "claude-code" or "echo".
  string model = 1;
  // sandbox is the isolation a session runs in, for example "docker" or "local".
  string sandbox = 2;
  // store is where workspaces and sessions are kept, for example "postgres" or "memory". A memory
  // store loses every workspace and session when the process restarts, which is worth seeing before
  // starting work rather than after.
  string store = 3;
  // state is where a session's conversation and files are kept, for example "host directory". Empty
  // means they are kept nowhere: they live in the container and are destroyed with it.
  string state = 4;
  // 5 was events, the event log an exec was recorded on. There is no event log: the store is the only
  // thing an exec is written to.
  reserved 5;
  // secrets is where a workspace's credentials are kept, for example "postgres, sealed". A system that
  // keeps them in memory loses the subscription token on every restart, which is worth seeing before
  // wondering why an exec stopped working.
  string secrets = 6;
  // sandbox_build is the build of the system the sandbox image was made from, for example "37b070b".
  // Sessions run whatever that image holds, so an image older than the tool means the system moved on
  // and the containers did not: the `krewe` inside one is from that build, or is not there at all.
  // Empty means the image says nothing about which build it came from, which is every image made
  // before this was stamped, and nothing is claimed about it either way.
  string sandbox_build = 7;
  // version is the build of the system this control plane was made from, for example "5bf99a0". Empty
  // means this system predates the field, so nothing is claimed about which build it is. The tool, the
  // control plane and the sandbox image are built on their own and drift apart, and three defects
  // were investigated as live on 27 August 2026 that were fixed already, because nothing said so.
  string version = 8;
}

// GetHealthRequest asks what the system last found when it probed the parts of itself it has to write
// to before a dispatch can start.
message GetHealthRequest {}
// GetHealthResponse is that probe's last reading, one entry per part.
//
// It answers from the last probe and never probes on the call, for the reason GetHeadroomResponse
// does: a broker that is down costs the whole export budget on every write, so a view that probed
// when it drew would stall for as long as the thing it is reporting on is broken.
//
// It is a different message from GetInfoResponse on purpose. That one is configuration, fetched once
// and never a verdict; this one is a verdict and goes stale, which is why it carries the time it was
// taken.
message GetHealthResponse {
  // components is what was probed, in the order a dispatch needs them. A part the system does not
  // probe is not in here at all, and a caller reading it must say so rather than filling the gap
  // with a colour: the whole point of this call is that a part nothing checked must not read the
  // same as a part that answered.
  repeated HealthComponent components = 1;
  // checked_at is when the probe ran. Unset means the system has never probed, which is a system that
  // started a moment ago.
  google.protobuf.Timestamp checked_at = 2;
}
// HealthComponent is one part of the system and what the last probe of it found.
message HealthComponent {
  // name is the part, for example "store".
  string name = 1;
  // state is one word: "serving" when the probe landed, "down" when it did not, and "not configured"
  // for a part this system has none of, which is an event log nothing is connected to. Down has to be
  // readable without reading the detail beside it.
  string state = 2;
  // detail is why it is down, for example "the event log did not take a record: ...". Empty when
  // there is nothing wrong to say.
  string detail = 3;
}

// GetUsageRequest asks what the system has cost so far.
message GetUsageRequest {}
// GetUsageResponse is every conversation the system holds, added up.
message GetUsageResponse {
  Usage total = 1;
  // sessions is how many conversations went into the total, so a number with nothing behind it can be
  // told from a system that has genuinely spent nothing.
  int64 sessions = 2;
}

// Exec is one exchange with the model, read back from the projection of the event log.
message Exec {
  string id = 1;
  string session = 2;
  // prompt is what was asked, reply is what came back, empty when the exec failed.
  string prompt = 3;
  string reply = 4;
  // status is the session's status after the exec: "idle" when it worked, "failed" when it did not.
  string status = 5;
  // failure says what went wrong, empty on an exec that worked.
  string failure = 6;
  google.protobuf.Timestamp occurred_at = 7;
  // trace_id is the trace the call that ran this exec belonged to, and empty for an exec nothing was
  // tracing. A reader holding it can open the trace, and it is the same value every log line written
  // under that call carries, so the two join. See issue 346.
  string trace_id = 8;
}

// ListExecsRequest asks for one session's history, most recent last, so a conversation reads the way
// it happened.
message ListExecsRequest {
  string session = 1;
  // limit caps how many come back. Zero means a sensible default rather than everything, because a
  // long running session's history is unbounded and a terminal is not.
  int32 limit = 2;
}
message ListExecsResponse {
  repeated Exec execs = 1;
}

// ListSessionEventsRequest asks for a session's lifecycle, most recent last, the way it happened. A
// session left out asks for the whole system's, which is what a view of what is going on reads.
message ListSessionEventsRequest {
  string session = 1;
  // limit caps how many come back. Zero means a sensible default rather than everything.
  int32 limit = 2;
}
message ListSessionEventsResponse {
  repeated SessionEvent events = 1;
}

// ControlPlane is the spine API. Channels feed the event log; the dashboard and CLI drive this.
service ControlPlaneService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc SetDeployTarget(SetDeployTargetRequest) returns (SetDeployTargetResponse);
  rpc SetProjectRepository(SetProjectRepositoryRequest) returns (SetProjectRepositoryResponse);

  rpc AttachChannel(AttachChannelRequest) returns (AttachChannelResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc OpenDriver(OpenDriverRequest) returns (OpenDriverResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc AttachSession(AttachSessionRequest) returns (AttachSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  // StopExec halts the exec a session is running and keeps the session. StopSession above puts the
  // whole session down; this is the one an operator reaches for when an exec is doing the wrong thing.
  rpc StopExec(StopExecRequest) returns (StopExecResponse);
  // ReclaimSession takes a settled session's container back and keeps everything else. The controller
  // calls it; nothing an operator types does.
  rpc ReclaimSession(ReclaimSessionRequest) returns (ReclaimSessionResponse);
  rpc DrainSessions(DrainSessionsRequest) returns (DrainSessionsResponse);
  rpc RestartSession(RestartSessionRequest) returns (RestartSessionResponse);
  rpc ArchiveSession(ArchiveSessionRequest) returns (ArchiveSessionResponse);
  rpc RestoreSession(RestoreSessionRequest) returns (RestoreSessionResponse);
  rpc SetSessionPermissionMode(SetSessionPermissionModeRequest) returns (SetSessionPermissionModeResponse);
  rpc SetSessionLabel(SetSessionLabelRequest) returns (SetSessionLabelResponse);
  rpc ListContexts(ListContextsRequest) returns (ListContextsResponse);
  rpc SetContext(SetContextRequest) returns (SetContextResponse);

  // What a project is for and what was designed for it. The driver may call the first three: reading
  // what the project holds is the point, and a session that writes a design grants itself nothing.
  rpc GetDesign(GetDesignRequest) returns (GetDesignResponse);
  rpc SetBrief(SetBriefRequest) returns (SetBriefResponse);
  rpc SetDesign(SetDesignRequest) returns (SetDesignResponse);
  // The operator's word on a design, and the driver is refused it. A session that could approve its
  // own design would be agreeing with itself, which is the whole thing this gate exists to stop.
  rpc ApproveDesign(ApproveDesignRequest) returns (ApproveDesignResponse);

  // The path a design was broken into. The control plane parses the document, so the command line
  // and the console send the same words and cannot drift on the grammar.
  //
  // The driver may call both: a design session is what writes a path, and writing one grants it
  // nothing that dispatching would not.
  rpc SetPath(SetPathRequest) returns (SetPathResponse);
  rpc ListSteps(ListStepsRequest) returns (ListStepsResponse);
  // Taking a step starts a session on it. The driver may call it, because a take is a dispatch and
  // the driver already has that: it reaches nothing here it could not reach by dispatching itself.
  // The refusal an unapproved design earns is the gate, and it is on the operator's own command as
  // much as on this one.
  rpc TakeStep(TakeStepRequest) returns (TakeStepResponse);

  // The narrowed parts of a project. The driver may call all three: a design session reads what
  // features exist and names the ones it is about to write paths for, and naming one grants it
  // nothing that dispatching would not.
  rpc ListFeatures(ListFeaturesRequest) returns (ListFeaturesResponse);
  rpc AddFeature(AddFeatureRequest) returns (AddFeatureResponse);
  rpc SetFeatureIntention(SetFeatureIntentionRequest) returns (SetFeatureIntentionResponse);
  // Reads a file, or a listing, out of the work a session left behind, without attaching to it.
  rpc ReadSessionWork(ReadSessionWorkRequest) returns (ReadSessionWorkResponse);
  // Says where an address is on the machine, so a person can put a file in it by hand. It reads the
  // layout rather than a running container, so it answers when nothing is running.
  rpc LocateDirectory(LocateDirectoryRequest) returns (LocateDirectoryResponse);

  rpc ImportSkill(ImportSkillRequest) returns (ImportSkillResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc AttachSkill(AttachSkillRequest) returns (AttachSkillResponse);
  rpc DetachSkill(DetachSkillRequest) returns (DetachSkillResponse);

  rpc ImportHook(ImportHookRequest) returns (ImportHookResponse);
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse);
  rpc AttachHook(AttachHookRequest) returns (AttachHookResponse);
  rpc DetachHook(DetachHookRequest) returns (DetachHookResponse);

  rpc ListExecs(ListExecsRequest) returns (ListExecsResponse);

  // What a workspace lets its sessions declare. The operator reads and sets these; a session may do
  // neither, because a caller that could raise its own ceiling has no ceiling.
  // What waits for a person, in one read, so every surface tells them the same thing.

  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);

  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  // GetUsage adds up what every conversation in the system has cost. It is a running total rather than
  // configuration, which is why it is not part of GetInfo.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

  // GetHealth is the system's last probe of the parts it has to write to before a dispatch can start.
  // It is a verdict, which is why it is not part of GetInfo, and it answers from the last probe for
  // the reason GetHeadroom answers from the last sample.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
}
