syntax = "proto3";

package quaycrew.v1;

import "google/protobuf/timestamp.proto";
import "quaycrew/v1/events.proto";

// A workspace is the runtime unit of isolation. Created through this API, never stored in the repo.
message Workspace {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

// A channel attached to a workspace (for example a Telegram bot).
message Channel {
  string workspace = 1;
  string id = 2;
  string kind = 3;
}

// A project is a body of work inside a workspace. Sessions happen inside a project, and share the
// context the project carries.
message Project {
  string id = 1;
  string workspace = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
}

// A session is one conversation inside a project: the operator's word for what the control plane
// runs as a session in a sandbox. It carries its workspace too, denormalised from the project so a
// listing does not need a join; a project never moves workspace.
message Session {
  // id is the crew's own identifier for this session. It names the session's sandbox container.
  string id = 1;
  string workspace = 2;
  // handle is the name a channel dispatches to: dispatch to the same handle and the conversation
  // continues. It is chosen by whoever starts the session, or minted when nobody did.
  string handle = 3;
  // status is where the session is: "idle" when it is waiting for you, "running" while a task is under
  // way, "failed" when the last task did not land, "reclaimed" when the crew took its container back,
  // and "stopped" when the session was put down.
  string status = 4;
  // model_session_id is the model's own identifier for the conversation, in the model's own word,
  // used to resume it.
  string model_session_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string project = 8;
  // archived_at is when the session was put away. Unset means it is live. Archiving hides a session
  // from the default listing and deletes nothing, so this is reversible by clearing it.
  google.protobuf.Timestamp archived_at = 9;
  // permission_mode is what the model is allowed to do without asking, for this session's tasks:
  // "plan", "acceptEdits" or "bypassPermissions". It belongs to the session rather than to a task, so
  // a session started to plan something keeps planning.
  string permission_mode = 10;
  // driver says this session drives the crew rather than doing work inside it. It reaches the
  // control plane's own interface, and whatever host paths the operator handed it, which an
  // ordinary session does not.
  bool driver = 11;
  // usage is what this session's conversation has cost so far, read from the transcript the model
  // keeps. Unset for a session nobody has spoken in.
  Usage usage = 12;
  // stale says this session's live sandbox was born before the workspace's current skill set, so it
  // does not hold what a fresh one would. A sandbox is born with its capabilities and never
  // drifts; restarting the session builds a new one, born current. A stopped session is never
  // stale, because its next sandbox is born with the current set.
  bool stale = 13;
  // label is what the operator calls this conversation, empty until they say. Nothing automatic ever
  // writes it: a name somebody picked is the one thing in a listing that is certainly right.
  string label = 14;
  // description is what the crew observed the conversation to be, one line, written by the model that
  // had the task. Empty until a task has happened. A listing prefers the label when there is one.
  string description = 15;
  // described_at_task is how many tasks the session had when its description was written, so a
  // conversation that has moved on can be described again. Zero means never described.
  int32 described_at_task = 16;
  // context_window is how full the model's context window is. Absent where the crew cannot say.
  ContextWindow context_window = 17;
  // role is the name of the role this session runs as, empty for a session that runs as nobody in
  // particular. It is set when the session is made and never changes: the boundary a role declares
  // has to hold for every task of the session, not only the first, and a sandbox is born with its
  // capabilities anyway.
  string role = 18;
  // reclaimed_at is when the crew took this session's container back. Unset means it holds one, or
  // never had one taken. The row, the conversation handle and the files on the host all stay, so the
  // next task builds a fresh container over the same state and the conversation carries on.
  //
  // It is a stamp of its own rather than a reading of updated_at, because how long a session has been
  // reclaimed is what the archive time is measured against, and updated_at moves on every write.
  google.protobuf.Timestamp reclaimed_at = 19;
  // presence is what the crew found inside this session's sandbox, and it is the half of "is anything
  // happening here" that status never knew. status only says whether a dispatched task is open, so a
  // session holding a conversation somebody started by hand read idle, and idle is the word that
  // invites a restart, a drain or a reclaim.
  //
  // Set only when the request asked for it, because the answer costs a question to the sandbox. Unset
  // means nobody asked, which is not the same as nothing being there.
  SessionPresence presence = 20;
  // title is the name the session was dispatched with, written when the session is made and never
  // afterwards. A job carries its declared title here, so a listing says which conversation is which
  // from the first second, rather than once a description is written behind a task that has landed.
  //
  // It is a third name rather than a second use of label, because the two are typed at different
  // moments about different things: the title names the job the session was made for, and the label
  // is what the operator calls this conversation once they have seen it. A dispatch that has to be
  // made again would put the job title back over a label the operator set in the meantime.
  string title = 21;
}

// SessionPresence is what is inside a session's sandbox right now, read from the sandbox itself
// rather than from anything the crew wrote down.
//
// Read from the sandbox because a stamp needs somebody to keep it fresh, how often is a number, and
// no measurement has set one. The sandbox already knows: its own process table says whether a model
// runtime is up, and its own tmux says whether a client is on the conversation.
//
// The order matters to a reader. Anything but EMPTY means something in that container is somebody's,
// so a caller deciding whether to take a container away treats every other value as "leave it alone".
enum SessionPresence {
  // Nobody asked. It is not an answer, and a caller that reads it as "nothing is there" is making
  // the mistake this field exists to stop.
  SESSION_PRESENCE_UNSPECIFIED = 0;
  // The crew asked and found nothing: no model runtime, and nobody attached. The only real idle.
  SESSION_PRESENCE_EMPTY = 1;
  // A model runtime is up inside the sandbox with nobody watching it. A conversation somebody
  // started and walked away from is here, and so is one still answering.
  SESSION_PRESENCE_AWAKE = 2;
  // Somebody has the conversation open.
  SESSION_PRESENCE_ATTACHED = 3;
  // The crew asked and could not be told: the daemon did not answer. Never idle, because a caller
  // reads idle as licence to close a container.
  SESSION_PRESENCE_UNTOLD = 4;
}

// ContextWindow is how full a conversation's context window is.
//
// This is the model's context window, not the crew's context documents. It is the number that says
// whether a conversation is still worth continuing, and it is not the same thing as what the
// conversation has cost: cost only grows, while the window empties again when the model compacts.
message ContextWindow {
  // used is what the next task carries: everything sent on the last answer, including what was read
  // back from the cache, because that is the context rather than the part of it charged as new. Read
  // from the transcript the model keeps.
  int64 used = 1;
  // size is how big the window is. The crew cannot work that out for itself, so this is what the
  // model runtime last told a session in this workspace. Zero where nothing has told it yet, which a
  // listing shows as a count rather than as a guessed share.
  int64 size = 2;
}

// Usage is what a conversation has cost, in tokens.
//
// Four numbers rather than two. On a real conversation the input was 52 tokens and the cache read was
// 1,723,404, because almost everything sent is the context being read again on every task: reporting
// only what was sent and what came back would show the 52 and hide the rest.
message Usage {
  // input is what was sent and charged as new, not counting anything served from the cache.
  int64 input = 1;
  // output is what came back.
  int64 output = 2;
  // cache_read is context the model read from its cache rather than being sent again.
  int64 cache_read = 3;
  // cache_written is context put into the cache to be read on later tasks.
  int64 cache_written = 4;
}

message CreateWorkspaceRequest {
  string name = 1;
}
message CreateWorkspaceResponse {
  Workspace workspace = 1;
}
message GetWorkspaceRequest {
  string id = 1;
}
message GetWorkspaceResponse {
  Workspace workspace = 1;
}
message ListWorkspacesRequest {}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}
message DeleteWorkspaceRequest {
  string id = 1;
}
message DeleteWorkspaceResponse {}

message CreateProjectRequest {
  string workspace = 1;
  string name = 2;
}
message CreateProjectResponse {
  Project project = 1;
}
message GetProjectRequest {
  string id = 1;
}
message GetProjectResponse {
  Project project = 1;
}
// ListProjectsRequest lists every project when workspace is empty, or one workspace's when set.
message ListProjectsRequest {
  string workspace = 1;
}
message ListProjectsResponse {
  repeated Project projects = 1;
}
// A flow run: one instance of a graph, pinned to the version it started with, moving one node at a
// time. It is carried by a job, and every step it takes is a job under that one,
// so a run sits inside the job tree rather than beside it.
message FlowRun {
  string id = 1;
  string workspace = 2;
  string project = 3;
  string graph_name = 4;
  int32 graph_version = 5;
  // node is where the run sits, and status is running, done or failed.
  string node = 6;
  string status = 7;
  // state is the run's own small memory: what the trigger carried, and what the last task replied.
  map<string, string> state = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // transitions is how many movements the run has taken, against the cap its graph declares, and
  // spent is what its conversation has cost in tokens.
  int32 transitions = 11;
  int64 spent = 12;
  // question is what an asking run is waiting to be told. Empty on a run that is not asking.
  string question = 14;
  // reason says why a stopped run stopped. Empty on one that is running or that finished: a run
  // that went quiet and a run that was halted must never read the same.
  string reason = 13;
  // job is the job that carries this run. There is one tree and it is the job tree, so a
  // run hangs inside it rather than beside it: that is what makes the depth limit and the tree budget
  // bound a run at all. Every step the run takes is another job under this one.
  string job = 15;
}

// ImportFlowRequest carries a graph as authored. The version inside it is the pin a run takes, so
// the same name and version twice is refused rather than replaced.
message ImportFlowRequest {
  string definition = 1;
}
message ImportFlowResponse {
  string name = 1;
  int32 version = 2;
}

// StartFlowRequest begins a run of the newest version of a graph, in one project. It answers with
// the run rather than waiting for it: a run dispatches tasks, and those take as long as the model
// takes.
message StartFlowRequest {
  string graph = 1;
  string project = 2;
  // state seeds the run's memory, which is what a prompt template reads.
  map<string, string> state = 3;
}
message StartFlowResponse {
  FlowRun run = 1;
}

message GetFlowRunRequest {
  string id = 1;
}
message GetFlowRunResponse {
  FlowRun run = 1;
}

// ListFlowRunsRequest lists runs, narrowed to one project when project is set.
// StopFlowRunRequest halts a run in flight. The reason is kept on the run, because a run somebody
// stopped and a run that went quiet must never read the same.
// AnswerFlowRunRequest tells a run what the operator decided, which is the only thing that moves a
// run waiting on a person: no timer answers a question.
message AnswerFlowRunRequest {
  string id = 1;
  string answer = 2;
}
message AnswerFlowRunResponse {
  FlowRun run = 1;
}

// ScheduleFlowRequest starts a graph running on its own in one project, at the interval the graph
// itself declares. The interval lives in the graph, where it is versioned and reviewable; where it
// runs is the operator's to say, because a run needs a project to dispatch into.
message ScheduleFlowRequest {
  string graph = 1;
  string project = 2;
}
message ScheduleFlowResponse {
  // every_seconds is the interval the graph declared, echoed so the operator sees what they got.
  int64 every_seconds = 1;
}

message UnscheduleFlowRequest {
  string graph = 1;
  string project = 2;
}
message UnscheduleFlowResponse {}

message StopFlowRunRequest {
  string id = 1;
  string reason = 2;
}
message StopFlowRunResponse {
  FlowRun run = 1;
}

message ListFlowRunsRequest {
  string project = 1;
}
message ListFlowRunsResponse {
  repeated FlowRun runs = 1;
}

message DeleteProjectRequest {
  string id = 1;
}
message DeleteProjectResponse {}

message AttachChannelRequest {
  string workspace = 1;
  string id = 2;
  string kind = 3;
}
message AttachChannelResponse {
  Channel channel = 1;
}

// SecretProjection is how a secret reaches a sandbox. The store holds bytes under a name and knows
// nothing else about them; how they are presented is a separate choice, which is the shape Kubernetes
// and Docker both settled on.
//
// Unspecified reads as the environment, so a client written before this existed still sets the
// secrets it always set.
enum SecretProjection {
  SECRET_PROJECTION_UNSPECIFIED = 0;
  // The value becomes an environment variable named after the secret.
  SECRET_PROJECTION_ENV = 1;
  // The value becomes a file, and does not reach the environment at all.
  SECRET_PROJECTION_FILE = 2;
}

// SetSecretRequest carries a secret value that is stored in the secrets backend, never returned.
message SetSecretRequest {
  // workspace is the workspace it belongs to, and is ignored when scope is "crew".
  string workspace = 1;
  string key = 2;
  string value = 3;
  SecretProjection projection = 4;
  // scope is "workspace", which is what an empty value means, or "crew". A secret set on the crew
  // reaches every workspace, including the ones made after it, which is the difference between
  // setting a shared token once and setting it again for each workspace. A workspace that sets the
  // same name keeps its own value.
  string scope = 5;
}
message SetSecretResponse {}

// DispatchRequest starts a new session (handle empty) or continues an existing one.
message DispatchRequest {
  string project = 1;
  string handle = 2;
  string text = 3;
  // permission_mode is what the session's tasks may do without asking, and it applies from this task
  // on: "plan", "acceptEdits" or "bypassPermissions". Empty leaves the session as it is, which is what
  // every caller that does not care sends.
  //
  // It travels with the dispatch that starts a session because a sandbox is born with its
  // capabilities and never drifts. Starting a session and then changing its mode costs a restart.
  string permission_mode = 4;
  // detach answers as soon as the session exists and runs the task behind the answer. The reply comes
  // back empty, because there is not one yet: the session reads "running" until the task lands, and
  // its tasks say what came back.
  //
  // It is what a surface that draws a screen needs. A task takes as long as the job takes, which is
  // minutes, and a caller that waits for one is a caller that is not drawing anything. The console
  // waited, gave up at thirty seconds, and left a session whose conversation never happened.
  bool detach = 5;
  // role names the role the session runs as, and is read only when the session is made: a role is
  // the whole instruction and the whole boundary of a session, so it cannot be put on afterwards.
  // A workspace that does not hold the named role is refused by name, because a step that names a
  // role nobody attached must fail with a sentence rather than half run.
  string role = 6;
  // job is the job this task runs for, and only the operator may name one. The crew mints
  // a credential bound to that job for this task and puts it in the environment of this task alone.
  //
  // Per task rather than at sandbox birth, because a sandbox is born with its configuration and keeps
  // it: a credential written at birth would label every later task with the first task's grant, and a
  // grant made after birth would never reach the container at all.
  string job = 7;
  // title is what to call the session this dispatch makes, and it is read only when the session is
  // made: a name a caller sends with every task must not overwrite what the operator has called the
  // conversation since.
  //
  // It is what a caller that already knows the name sends. A job is declared with a title, and
  // without this the crew is handed that name and drops it, which leaves a listing of running jobs
  // waiting for a description written after the work is over.
  string title = 8;
}
message DispatchResponse {
  string id = 1;
  string handle = 2;
  // reply is what the model said, and is empty when the request detached: the task is still running,
  // so there is nothing to say yet.
  string reply = 3;
}

// ListSessionsRequest filters by project when set, else by workspace when set, else lists all.
// OpenDriverRequest asks for a project's driver, the session that drives the crew.
message OpenDriverRequest {
  string project = 1;
}
message OpenDriverResponse {
  Session session = 1;
}

message ListSessionsRequest {
  string workspace = 1;
  string project = 2;
  // archived lists the sessions that have been put away instead of the live ones. The two are never
  // mixed: a listing is one or the other, because the default view must not quietly grow the sessions
  // somebody deliberately hid.
  bool archived = 3;
  // presence asks each session's own sandbox what is in it, so a listing can tell a session holding a
  // live conversation from one holding nothing at all.
  //
  // It costs one question to the sandbox per row that would otherwise read idle, so it is asked for
  // rather than always done: the surfaces an operator reads set it, and the machinery that resolves
  // an address or finds a session by name does not pay for it.
  bool presence = 4;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
}
message GetSessionRequest {
  string id = 1;
}
message GetSessionResponse {
  Session session = 1;
}
// AttachSessionRequest asks how to get inside a session's conversation.
message AttachSessionRequest {
  string id = 1;
}
// AttachSessionResponse describes the command that opens the conversation, and deliberately carries
// no credential: the operator's own environment supplies that.
message AttachSessionResponse {
  // sandbox is the container the session runs in.
  string sandbox = 1;
  // argv is the command to run inside it, for example ["claude", "--resume", "<conversation id>"].
  repeated string argv = 2;
}

message StopSessionRequest {
  string id = 1;
}
message StopSessionResponse {}

// DrainSessionsRequest puts every live session down, so whatever is about to take the containers
// away finds nothing running. `make upgrade` removes them by name from the daemon, which ends a task
// in flight as "exit status 137" and leaves the row saying it was born holding skills its next
// container will not have.
message DrainSessionsRequest {
  // force drains even when a task is under way. Without it a task in flight refuses the drain, and
  // the answer names what is working so the operator can wait for it instead.
  bool force = 1;
}
message DrainSessionsResponse {
  // stopped is what went down, so the caller can say what it did rather than a count.
  repeated Session stopped = 1;
  // working is what was under way. Empty unless force was given: without it the drain refuses.
  repeated Session working = 2;
}

// RestartSessionRequest brings a stopped session back.
message RestartSessionRequest {
  string id = 1;
}
// RestartSessionResponse carries the session as it now is, idle and with a sandbox running, so the
// caller does not have to read it back to find out what happened.
message RestartSessionResponse {
  Session session = 1;
}

// ArchiveSessionRequest puts a session away: stops it if it is running, hides it from the default
// listing, and keeps everything.
message ArchiveSessionRequest {
  string id = 1;
}
message ArchiveSessionResponse {
  Session session = 1;
}

// ReclaimSessionRequest takes a settled session's container back and leaves everything else.
//
// It is the controller's move rather than an operator's, and it is not a stop. A stop is somebody's
// decision and reads as one; a reclaim is the crew saving memory on a session nobody is using, and
// the next task to arrive builds a fresh container over the same conversation and the same files.
//
// A session with a task under way is refused, and so is one an operator already stopped: overwriting
// a decision with bookkeeping is how a stop stops meaning anything.
message ReclaimSessionRequest {
  string id = 1;
}
message ReclaimSessionResponse {
  Session session = 1;
}

// StopTaskRequest halts the task a session is running now and keeps the reason.
//
// The session survives: its conversation, its container and its history all stay, so the next
// dispatch continues it. That is the difference between this and StopSession, which puts the whole
// session down and takes its container away.
//
// The task reads "stopped" with the reason rather than "failed". An operator asking for a stop is
// not a fault, and a stop that reports as a crash hides the real crashes.
message StopTaskRequest {
  string id = 1;
  // reason is what to record against the task, in the operator's own words. Empty records that
  // somebody stopped it and nothing about why.
  string reason = 2;
}
message StopTaskResponse {
  // stopped says whether there was a task to stop. False means nothing was running, which is not a
  // failure: the caller asked for a state the session is already in.
  bool stopped = 1;
  // session is the session as it now is, so the caller does not read it back.
  Session session = 2;
}

// ContextDir is a directory of files the model reads, kept on the host and mounted into every sandbox
// for its scope. Editing context is editing files, so what matters is where they are.
message ContextDir {
  // scope is "workspace" or "project".
  string scope = 1;
  // name is what that workspace or project is called.
  string name = 2;
  // host is the directory on the machine running the sandboxes, which is where it is edited.
  string host = 3;
  // sandbox is where the same directory appears inside a session's container.
  string sandbox = 4;
  // memory is the file the model reads as its memory for this scope, inside host.
  string memory = 5;
  // written says whether anything has been written at this scope. An empty directory is the normal
  // state and says nothing about whether context is set up, so this is the difference worth showing.
  bool written = 6;
  // owner is what to name when setting this context: a workspace or project identifier, and empty
  // for the crew.
  string owner = 7;
  // body is what the model is told at this scope. It comes from the store, which is where context
  // lives; the file in a sandbox is a rendering of it.
  string body = 8;
}

// SetContextRequest records what the model should be told at a scope. The crew's context has no
// owner; a workspace's and a project's are owned by their identifier.
message SetContextRequest {
  // scope is "crew", "workspace" or "project".
  string scope = 1;
  string owner = 2;
  string body = 3;
}
message SetContextResponse {
  ContextDir dir = 1;
}

// SecretRef names a secret a workspace has set. It carries no value and there is no call that returns
// one: a value the backend holds must not become readable because a client asked politely. The only
// reader is the crew itself, at the moment a task needs it.
message SecretRef {
  string workspace = 1;
  // workspace_name is what to call that workspace where a human reads it.
  string workspace_name = 2;
  string name = 3;
  google.protobuf.Timestamp updated_at = 4;
  // projection is how this one reaches a sandbox. Where it lands is not carried, because it is
  // derived from the name and every reader would derive the same path.
  SecretProjection projection = 5;
  // crew says the crew holds this one, so every workspace reads it without setting anything. Its
  // workspace is then empty, because it belongs to no single workspace.
  bool crew = 6;
}

// ListSecretsRequest lists what one workspace has set, or every workspace's when it is empty. The
// crew's own are in both answers, marked, because they reach every workspace either way.
message ListSecretsRequest {
  string workspace = 1;
}
message ListSecretsResponse {
  repeated SecretRef secrets = 1;
}

// A skill is a capability a session can be given: a brief the model reads, the binaries it needs and
// the secrets it names. It is authored as a directory in a git repository and imported here, pinned to
// a version, so a skill edited in its repository cannot change a session that is already using it.
//
// It carries no secret value and no brief. The brief is a file, and a listing of what a crew can do
// should not be a page per entry.
message Skill {
  string name = 1;
  int32 version = 2;
  // summary says when to reach for this skill, in a sentence. It is the line a session is told.
  string summary = 3;
  // binaries are the commands the skill needs in the sandbox image. A session missing one is refused
  // before a task runs.
  repeated string binaries = 4;
  repeated SkillSecret secrets = 5;
  google.protobuf.Timestamp imported_at = 6;
  // crew says the crew holds this skill, so every workspace has it without attaching anything.
  bool crew = 8;
  // left_out says why a skill the workspace holds is not given to its sessions, and is empty when it
  // is given. A skill naming a secret the workspace has not set is held and not given, rather than
  // refusing the task, so one unusable skill cannot stop every conversation in the workspace.
  string left_out = 7;
}

// SkillSecret names a secret a skill needs and says what it is for. Never a value: a value written into
// a skill file is a value in a git repository.
message SkillSecret {
  string name = 1;
  // purpose says which credential to go and get, and how to set it, for whoever reads a refusal.
  string purpose = 2;
}

// SkillFile is one file of a skill's directory, on its way into the crew.
message SkillFile {
  // path is relative to the skill's directory, with forward slashes.
  string path = 1;
  bytes body = 2;
  // executable says the file has to be runnable, which a setup script is and nothing else is assumed
  // to be.
  bool executable = 3;
}

// ImportSkillRequest carries a skill's whole directory.
//
// The files travel rather than the path, because the control plane runs in a container and a directory
// on the operator's machine means nothing to it. The client reads and sends; this side parses,
// validates and refuses, so there is one validator rather than one per client.
message ImportSkillRequest {
  repeated SkillFile files = 1;
}
message ImportSkillResponse {
  Skill skill = 1;
}

// ListSkillsRequest lists what the crew has imported, what one workspace holds when workspace is
// set, or what one session actually holds when session is set: the same answer the session's sandbox
// is built from, both the crew's own skills and the workspace's, the workspace winning a name
// collision.
message ListSkillsRequest {
  string workspace = 1;
  string session = 2;
}
message ListSkillsResponse {
  repeated Skill skills = 1;
}

// AttachSkillRequest gives a workspace a skill, at the version the crew holds now. Every session in the
// workspace then holds it.
message AttachSkillRequest {
  // workspace is the workspace to give it to, and is ignored when scope is "crew".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "crew". A skill attached to the
  // crew is held by every workspace, including the ones made after it, which is the difference
  // between setting a crew up once and setting each workspace up again.
  string scope = 3;
}
message AttachSkillResponse {
  Skill skill = 1;
}

// DetachSkillRequest takes a skill away from a workspace. The skill stays imported.
message DetachSkillRequest {
  // workspace is the workspace to take it from, and is ignored when scope is "crew".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "crew".
  string scope = 3;
}
message DetachSkillResponse {}

// Hook is a constraint a session runs under: what it may not do, checked when it tries. It is never
// read by the model, which is why there is no brief here and a skill has one.
message Hook {
  string name = 1;
  int32 version = 2;
  // summary is the line a listing shows. Nothing pays for it per task, because a hook is invisible
  // to the model until it fires.
  string summary = 3;
  // events are what this hook fires on, in the order they were written, which is the order they are
  // rendered into a session's settings.
  repeated HookBinding events = 4;
  // binaries are the commands the hook needs in the sandbox image. A session missing one is refused
  // before a task runs.
  repeated string binaries = 5;
  repeated SkillSecret secrets = 6;
  google.protobuf.Timestamp imported_at = 7;
  // crew says the crew holds this hook, so every workspace has it without attaching anything. It is
  // the level most hooks want: a constraint the crew agreed on is not usually a per workspace
  // opinion.
  bool crew = 8;
  // left_out says why a hook the workspace holds is not given to its sessions, and is empty when it
  // is given.
  string left_out = 9;
}

// HookBinding is one event a hook fires on.
message HookBinding {
  // on is the event the runtime raises, for example "PreToolUse" or "UserPromptSubmit". A name the
  // runtime never raises is refused at import, because a hook that is never called cannot be told
  // from one that approves of everything.
  string on = 1;
  // matcher is which tools this fires for, empty for every tool. Only PreToolUse and PostToolUse
  // fire per tool.
  string matcher = 2;
  // entry is the executable to run, relative to the hook's own directory.
  string entry = 3;
  // timeout_seconds is how long the runtime waits. Zero means the runtime's own default.
  int32 timeout_seconds = 4;
}

// HookFile is one file of a hook's directory.
message HookFile {
  // path is relative to the hook's directory, with forward slashes.
  string path = 1;
  bytes body = 2;
  // executable says the file has to be runnable, which an entry point is.
  bool executable = 3;
}

// ImportHookRequest carries a hook's whole directory, for the same reason ImportSkillRequest does:
// the control plane runs in a container where a path on the operator's machine means nothing.
message ImportHookRequest {
  repeated HookFile files = 1;
}
message ImportHookResponse {
  Hook hook = 1;
}

// ListHooksRequest lists what the crew has imported, what one workspace holds when workspace is set,
// or what one session actually holds when session is set.
message ListHooksRequest {
  string workspace = 1;
  string session = 2;
}
message ListHooksResponse {
  repeated Hook hooks = 1;
}

// AttachHookRequest gives a workspace a hook, at the version the crew holds now.
message AttachHookRequest {
  // workspace is the workspace to give it to, and is ignored when scope is "crew".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "crew".
  string scope = 3;
}
message AttachHookResponse {
  Hook hook = 1;
}

// DetachHookRequest takes a hook away from a workspace. The hook stays imported.
message DetachHookRequest {
  // workspace is the workspace to take it from, and is ignored when scope is "crew".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "crew".
  string scope = 3;
}
message DetachHookResponse {}

// Role is a named way of working a session is given: a brief the model reads, the model it runs on,
// and the material it is allowed to receive.
//
// The boundary is the point of it. A role that writes tests must not receive the code, or the two
// sessions are one conversation wearing two names, so receives is a declaration the crew can hold a
// session to rather than prose in a brief that asks it nicely.
message Role {
  string name = 1;
  int32 version = 2;
  // summary is the line a listing shows.
  string summary = 3;
  // model is which model a session running as this role uses, as a tier ("opus") or a full name
  // ("claude-opus-5"). Declared per role because the work differs.
  string model = 4;
  // receives is the material this role is given, sorted. A name the crew does not hand out is
  // refused at import, because a boundary that means nothing looks exactly like one that holds.
  repeated string receives = 5;
  google.protobuf.Timestamp imported_at = 6;
  // crew says the crew holds this role, so every workspace has it without attaching anything.
  bool crew = 7;
}

// RoleFile is one file of a role's directory, on its way into the crew.
message RoleFile {
  // path is relative to the role's directory, with forward slashes.
  string path = 1;
  bytes body = 2;
}

// ImportRoleRequest carries a role's directory, for the same reason ImportSkillRequest does: the
// control plane runs in a container where a path on the operator's machine means nothing.
message ImportRoleRequest {
  repeated RoleFile files = 1;
}
message ImportRoleResponse {
  Role role = 1;
}

// ListRolesRequest lists what the crew has imported, or what one workspace holds when workspace is
// set.
message ListRolesRequest {
  string workspace = 1;
}
message ListRolesResponse {
  repeated Role roles = 1;
}

// AttachRoleRequest gives a workspace a role, at the version the crew holds now.
message AttachRoleRequest {
  // workspace is the workspace to give it to, and is ignored when scope is "crew".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "crew".
  string scope = 3;
}
message AttachRoleResponse {
  Role role = 1;
}

// DetachRoleRequest takes a role away from a workspace. The role stays imported.
message DetachRoleRequest {
  // workspace is the workspace to take it from, and is ignored when scope is "crew".
  string workspace = 1;
  string name = 2;
  // scope is "workspace", which is what an empty value means, or "crew".
  string scope = 3;
}
message DetachRoleResponse {}

// GetRoleRequest asks for one role whole, the brief included, so what a session running as it is
// told can be read out of the crew rather than out of the directory it was imported from.
message GetRoleRequest {
  // workspace reads the version that workspace pinned. Empty reads what the crew has imported.
  string workspace = 1;
  string name = 2;
}
message GetRoleResponse {
  Role role = 1;
  // brief is the whole instruction a session running as this role is given. It travels here and
  // nowhere else: a listing was asked what the crew holds, not for a copy of every instruction.
  string brief = 2;
  // may is what a session running as this role may call, sorted. Empty is a role that may call
  // nothing, which is the default.
  repeated string may = 3;
  // held_by names every workspace that attached this role for itself, sorted. A role the crew holds
  // says so on the role and reaches every workspace without being named here.
  repeated string held_by = 4;
}

// ListContextsRequest asks where context lives: for one project when set, or for the whole crew.
message ListContextsRequest {
  string project = 1;
}
message ListContextsResponse {
  repeated ContextDir dirs = 1;
}

// SetSessionPermissionModeRequest changes what a session's tasks may do without asking.
message SetSessionPermissionModeRequest {
  string id = 1;
  // mode is "plan", "acceptEdits" or "bypassPermissions". An unknown one is refused rather than
  // passed to the model, which would take it as far as its own argument parser and no further.
  string mode = 2;
}
message SetSessionPermissionModeResponse {
  Session session = 1;
}
message SetSessionLabelRequest {
  string id = 1;
  // label is what to call this conversation. Empty clears it, which is the only way back to the
  // identifier, so it is a value rather than an absence.
  string label = 2;
}
message SetSessionLabelResponse {
  Session session = 1;
}

// RestoreSessionRequest brings an archived session back into the default listing.
message RestoreSessionRequest {
  string id = 1;
}
message RestoreSessionResponse {
  Session session = 1;
}

// GetInfoRequest asks what this control plane is running.
message GetInfoRequest {}
// GetInfoResponse says what a task dispatched here would actually do.
//
// It carries configuration, never a secret and never a health verdict. The console shows it so the
// operator can see which crew they are about to act on, the way a cluster name does.
message GetInfoResponse {
  // model is the backend a task runs against, for example "claude-code" or "echo".
  string model = 1;
  // sandbox is the isolation a session runs in, for example "docker" or "local".
  string sandbox = 2;
  // store is where workspaces and sessions are kept, for example "postgres" or "memory". A memory
  // store loses every workspace and session when the process restarts, which is worth seeing before
  // starting work rather than after.
  string store = 3;
  // state is where a session's conversation and files are kept, for example "host directory". Empty
  // means they are kept nowhere: they live in the container and are destroyed with it.
  string state = 4;
  // secrets is where a workspace's credentials are kept, for example "postgres, sealed". A crew that
  // keeps them in memory loses the subscription token on every restart, which is worth seeing before
  // wondering why a task stopped working.
  // events is the event log a task is recorded on, for example "redpanda". Empty means nothing is
  // connected to it, which is the truth today: the log is in the compose stack and no service reads
  // from or writes to it.
  string events = 5;
  // secrets is where a workspace's credentials are kept, for example "postgres, sealed". A crew that
  // keeps them in memory loses the subscription token on every restart, which is worth seeing before
  // wondering why a task stopped working.
  string secrets = 6;
  // sandbox_build is the build of the crew the sandbox image was made from, for example "37b070b".
  // Sessions run whatever that image holds, so an image older than the tool means the crew moved on
  // and the containers did not: the `quay` inside one is from that build, or is not there at all.
  // Empty means the image says nothing about which build it came from, which is every image made
  // before this was stamped, and nothing is claimed about it either way.
  string sandbox_build = 7;
  // version is the build of the crew this control plane was made from, for example "5bf99a0". Empty
  // means this crew predates the field, so nothing is claimed about which build it is. The tool, the
  // control plane and the sandbox image are built on their own and drift apart, and three defects
  // were investigated as live on 27 August 2026 that were fixed already, because nothing said so.
  string version = 8;
}

// GetHeadroomRequest asks how much room the machine has left for another session.
message GetHeadroomRequest {}
// GetHeadroomResponse is the crew's last reading of the machine it runs on.
//
// Every byte count is a string rather than a number, and the string is either a figure or the word
// "unknown". The crew knew nothing about its machine while the kernel killed eighteen sandboxes, and
// the fix for that must never be a zero standing in for a reading nobody took. A caller that wants
// to compare numbers reads the bytes fields beside them, which carry -1 for unmeasured.
message GetHeadroomResponse {
  // used is what every container on the daemon holds, added up. Every container rather than the
  // crew's own, because the cap binds all of them.
  string used = 1;
  // limit is the memory the daemon may hold, which is the limit that binds. On a Mac it is the
  // Docker virtual machine's cap and never the Mac's own memory.
  string limit = 2;
  // free is limit less used.
  string free = 3;
  // state is one word about the two above: "room", "tight", "full", or "unknown". Full has to be
  // readable without reading the number beside it.
  string state = 4;
  // machine_name is what the daemon calls the machine it runs on, for example "Docker Desktop".
  // Empty means the daemon did not say.
  string machine_name = 5;
  // machine_total, machine_available, swap_total and swap_used are the pressure on that machine,
  // which is a different question from what the daemon may hold. The kill on 27 August 2026 came
  // from a machine at 94 per cent of its swap while the daemon held less than half its cap.
  string machine_total = 6;
  string machine_available = 7;
  string swap_total = 8;
  string swap_used = 9;
  // sandboxes is one entry per session container, largest first.
  repeated HeadroomSandbox sandboxes = 10;
  // taken_at is when the reading was taken. Unset means the crew has never read the machine, which
  // is a crew with no daemon or a daemon that has never answered.
  google.protobuf.Timestamp taken_at = 11;
  // failed says what could not be read, empty when the whole reading worked. A reading that failed
  // never fails a command: the figures read unknown and the crew carries on.
  string failed = 12;
  // used_bytes and limit_bytes carry -1 where nothing measured them, so a caller comparing numbers
  // does not have to parse the strings above.
  int64 used_bytes = 13;
  int64 limit_bytes = 14;
}
// HeadroomSandbox is one session's container as the daemon reports it.
message HeadroomSandbox {
  string session = 1;
  // held is the memory this container holds, or "unknown".
  string held = 2;
  // processor is its share of one processor, for example "12.4%", or "unknown".
  string processor = 3;
  // idle is how long since this session's last task, for example "12m". Empty means the crew does
  // not know, which is a container with no session row beside it.
  string idle = 4;
  // held_bytes carries -1 where nothing measured it.
  int64 held_bytes = 5;
  // status is what the session's row says it is doing, for example "running" or "idle". Empty means
  // the crew holds no session for this container, which is a stray. An operator deciding what to
  // stop reads this first: the largest sandbox may be the one doing the work.
  string status = 6;
}

// GetUsageRequest asks what the crew has cost so far.
message GetUsageRequest {}
// GetUsageResponse is every conversation the crew holds, added up.
message GetUsageResponse {
  Usage total = 1;
  // sessions is how many conversations went into the total, so a number with nothing behind it can be
  // told from a crew that has genuinely spent nothing.
  int64 sessions = 2;
}

// Task is one exchange with the model, read back from the projection of the event log.
message Task {
  string id = 1;
  string session = 2;
  // prompt is what was asked, reply is what came back, empty when the task failed.
  string prompt = 3;
  string reply = 4;
  // status is the session's status after the task: "idle" when it worked, "failed" when it did not.
  string status = 5;
  // failure says what went wrong, empty on a task that worked.
  string failure = 6;
  google.protobuf.Timestamp occurred_at = 7;
  // trace_id is the trace the call that ran this task belonged to, and empty for a task nothing was
  // tracing. A reader holding it can open the trace, and it is the same value the job that
  // dispatched the task carries, so the two join. See issue 346.
  string trace_id = 8;
}

// ListTasksRequest asks for one session's history, most recent last, so a conversation reads the way
// it happened.
message ListTasksRequest {
  string session = 1;
  // limit caps how many come back. Zero means a sensible default rather than everything, because a
  // long running session's history is unbounded and a terminal is not.
  int32 limit = 2;
}
message ListTasksResponse {
  repeated Task tasks = 1;
}

// Job is one piece of declared intent. A caller writes it, and a controller makes reality match it.
//
// The record is the point: intent lives in a row rather than in a process, so it outlives the caller
// that asked for it, the session that runs it and the crew that was restarted underneath it.
message Job {
  string id = 1;
  string workspace = 2;
  string project = 3;

  // What the caller declared.
  // title is the one line a listing shows. brief is what the session is asked to do.
  string title = 4;
  string brief = 5;
  // role names how the job is done, empty for a job that runs as nobody in particular, and
  // role_version is the version pinned at the moment of the write so editing a role cannot change
  // a job already declared.
  string role = 6;
  int32 role_version = 7;
  // mode is what this job's tasks may do without asking. Empty leaves the session as it is born.
  string mode = 8;
  // expect_file is a path that must be in the working directory after the task, relative to it.
  // expect_contains is a string the answer must carry. Where either is set, a job that does not meet
  // its claim stops rather than reporting success.
  string expect_file = 9;
  string expect_contains = 10;
  // after names other jobs this job waits for. It is the whole ordering primitive: no condition, no
  // branch, no expression.
  repeated string after = 11;
  // deadline is the moment after which the job is stopped rather than started. A job already running
  // is not killed.
  google.protobuf.Timestamp deadline = 12;
  // budget_tokens is what this job and everything under it may spend. Zero draws from the parent.
  int64 budget_tokens = 13;
  // labels are free text pairs, so a caller finds its own job later.
  map<string, string> labels = 14;
  // requires is the material this job cannot be done without: the same words a role receives,
  // drawn from job, context and skills. A job that requires material its role does not receive is
  // refused at dispatch, before a container starts, rather than run blind.
  repeated string requires = 32;

  // What the crew assigned, and the caller may not.
  // parent is which job asked for this one, read from the credential the caller presented
  // and never from the request. depth is zero for a root and the parent's depth plus one otherwise.
  string parent = 15;
  int32 depth = 16;
  // version rises on every write to a declared field, so a status can be told current from stale.
  int32 version = 17;

  // What the controller writes, and nobody else.
  // phase is where the job is: pending, waiting, running, asking, done, failed or stopped. The last
  // three are terminal.
  string phase = 18;
  // session is the conversation the job runs in, empty until one exists. It is what quay attach
  // takes.
  string session = 19;
  int32 attempts = 20;
  // answer is what came back, whole. A listing leaves it out, because a listing of a hundred answers
  // is a listing nobody can read.
  string answer = 21;
  // reason says why a stopped or failed job ended. question is what an asking job waits to be told.
  string reason = 22;
  string question = 23;
  int64 spent_tokens = 24;
  // observed_version is the version of the declaration the status describes. A controller that has
  // not caught up leaves this behind the version above.
  int32 observed_version = 25;

  // trace_id is the trace this whole tree belongs to, minted at the root and inherited unchanged by
  // every descendant, so one identifier joins a job, its children, the tasks they ran and
  // the spans around them. parent_span_id is the span the caller was inside when it declared this
  // job, empty for a root nothing was tracing.
  //
  // Both are columns rather than something a process holds, which is what makes a trace survive a
  // controller that died: the context is in the declaration.
  string trace_id = 30;
  string parent_span_id = 31;

  google.protobuf.Timestamp created_at = 26;
  google.protobuf.Timestamp updated_at = 27;
  google.protobuf.Timestamp started_at = 28;
  google.protobuf.Timestamp finished_at = 29;
}

// CreateJobRequest declares a job. Every rule is checked here, while the caller is
// looking, rather than hours later inside a run with nothing pointing back at the declaration.
message CreateJobRequest {
  // project is where the job runs. A job needs one, because a dispatch needs one.
  string project = 1;
  string title = 2;
  string brief = 3;
  string role = 4;
  string mode = 5;
  string expect_file = 6;
  string expect_contains = 7;
  repeated string after = 8;
  google.protobuf.Timestamp deadline = 9;
  int64 budget_tokens = 10;
  map<string, string> labels = 11;
  // requires is the material this job cannot be done without, drawn from job, context and
  // skills. A word the crew does not hand out is refused by name.
  repeated string requires = 14;
  // id and parent are here to be refused rather than ignored. The crew assigns the identifier, and
  // the parent is read from the credential the caller presented: a caller that could set its own
  // parent could set its own depth, and the depth limit would bound nothing.
  string id = 12;
  string parent = 13;
}
message CreateJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string id = 1;
}
message GetJobResponse {
  Job job = 1;
}

// ListJobsRequest narrows a listing. The zero value is everything the crew holds.
message ListJobsRequest {
  // project wins over workspace when both are set, being the narrower.
  string workspace = 1;
  string project = 2;
  // parent narrows to the children of one job, and roots_only to jobs with no parent,
  // which cannot be said with parent alone because empty means do not narrow.
  string parent = 3;
  bool roots_only = 4;
  string phase = 5;
  // label_key with no label_value matches any value, which is how a caller finds everything it
  // labelled at all.
  string label_key = 6;
  string label_value = 7;
}
message ListJobsResponse {
  // Each job without its answer. Read one with GetJob to get the answer whole.
  repeated Job jobs = 1;
}

// StopJobRequest halts a job that has not ended. The reason is kept, because a job that went quiet
// and a job somebody halted must never read the same.
message StopJobRequest {
  string id = 1;
  string reason = 2;
}
message StopJobResponse {
  Job job = 1;
}

// WorkspaceLimits is the ceiling a workspace puts on the jobs its sessions declare.
//
// The workspace carries the ceiling and a role carries the grant, and the two mean different things:
// a role says what a session may do, and the workspace says how much of it. The effective capability
// is the intersection, and a refusal names the workspace limit rather than the role, because the
// limit is the thing an operator would change.
message WorkspaceLimits {
  string workspace = 1;
  // max_depth is how deep the tree of jobs may go. Zero, the default, means no session in this
  // workspace may declare a job at all: default deny, raised deliberately and per workspace.
  int32 max_depth = 2;
  // max_running is how many jobs may run at once in this workspace. Zero is unset, and the
  // crew ships it unset because no measurement has set it yet.
  int32 max_running = 3;
  // budget_tokens is what a tree of jobs may spend when its root declares none. Zero is unset.
  int64 budget_tokens = 4;
  // lease_seconds is how long a controller holds a job here before another may take it.
  // Zero takes the crew's own measured default.
  int32 lease_seconds = 5;
  // reclaim_seconds is how long a settled session keeps its container before the crew takes it back.
  // Zero is unset, and unset means the controller reclaims nothing here, however long it runs.
  //
  // The crew ships it unset and invents no number for it. Section 11 of docs/ORCHESTRATION.md names
  // the three measurements that would set it, and the command that takes each. None of them has been
  // run, so there is no number to write.
  int32 reclaim_seconds = 6;
  // archive_seconds is how long a reclaimed session waits before the crew files it away. Zero is
  // unset, and unset means the controller archives nothing here.
  int32 archive_seconds = 7;
  // request_memory_mib is the memory one sandbox in this workspace asks for, in mebibytes, which is
  // the unit the room view prints. The crew adds these up and admits a job only where its runtime
  // still has that much unallocated. Zero takes the crew's own measured request.
  int32 request_memory_mib = 8;
  // request_processor_percent is the processor share one sandbox here asks for, in per cent of one
  // processor, which is the unit the room view prints beside the memory. Zero takes the crew's own.
  int32 request_processor_percent = 9;
}

message GetWorkspaceLimitsRequest {
  string workspace = 1;
}
message GetWorkspaceLimitsResponse {
  WorkspaceLimits limits = 1;
}

// SetWorkspaceLimitsRequest writes the ceiling. Every field is written as it arrives, so reading
// first and sending the whole row back is how one of them is changed.
message SetWorkspaceLimitsRequest {
  WorkspaceLimits limits = 1;
}
message SetWorkspaceLimitsResponse {
  WorkspaceLimits limits = 1;
}

// ListSessionEventsRequest asks for a session's lifecycle, most recent last, the way it happened. A
// session left out asks for the whole crew's, which is what a view of what is going on reads.
message ListSessionEventsRequest {
  string session = 1;
  // limit caps how many come back. Zero means a sensible default rather than everything.
  int32 limit = 2;
}
message ListSessionEventsResponse {
  repeated SessionEvent events = 1;
}

// ControlPlane is the spine API. Channels feed the event log; the dashboard and CLI drive this.
service ControlPlaneService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  rpc ImportFlow(ImportFlowRequest) returns (ImportFlowResponse);
  rpc StartFlow(StartFlowRequest) returns (StartFlowResponse);
  rpc GetFlowRun(GetFlowRunRequest) returns (GetFlowRunResponse);
  rpc ListFlowRuns(ListFlowRunsRequest) returns (ListFlowRunsResponse);
  rpc StopFlowRun(StopFlowRunRequest) returns (StopFlowRunResponse);
  rpc AnswerFlowRun(AnswerFlowRunRequest) returns (AnswerFlowRunResponse);
  rpc ScheduleFlow(ScheduleFlowRequest) returns (ScheduleFlowResponse);
  rpc UnscheduleFlow(UnscheduleFlowRequest) returns (UnscheduleFlowResponse);

  rpc AttachChannel(AttachChannelRequest) returns (AttachChannelResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc OpenDriver(OpenDriverRequest) returns (OpenDriverResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc AttachSession(AttachSessionRequest) returns (AttachSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  // StopTask halts the task a session is running and keeps the session. StopSession above puts the
  // whole session down; this is the one an operator reaches for when a task is doing the wrong thing.
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // ReclaimSession takes a settled session's container back and keeps everything else. The controller
  // calls it; nothing an operator types does.
  rpc ReclaimSession(ReclaimSessionRequest) returns (ReclaimSessionResponse);
  rpc DrainSessions(DrainSessionsRequest) returns (DrainSessionsResponse);
  rpc RestartSession(RestartSessionRequest) returns (RestartSessionResponse);
  rpc ArchiveSession(ArchiveSessionRequest) returns (ArchiveSessionResponse);
  rpc RestoreSession(RestoreSessionRequest) returns (RestoreSessionResponse);
  rpc SetSessionPermissionMode(SetSessionPermissionModeRequest) returns (SetSessionPermissionModeResponse);
  rpc SetSessionLabel(SetSessionLabelRequest) returns (SetSessionLabelResponse);
  rpc ListContexts(ListContextsRequest) returns (ListContextsResponse);
  rpc SetContext(SetContextRequest) returns (SetContextResponse);

  rpc ImportSkill(ImportSkillRequest) returns (ImportSkillResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc AttachSkill(AttachSkillRequest) returns (AttachSkillResponse);
  rpc DetachSkill(DetachSkillRequest) returns (DetachSkillResponse);

  rpc ImportHook(ImportHookRequest) returns (ImportHookResponse);
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse);
  rpc AttachHook(AttachHookRequest) returns (AttachHookResponse);
  rpc DetachHook(DetachHookRequest) returns (DetachHookResponse);

  rpc ImportRole(ImportRoleRequest) returns (ImportRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc AttachRole(AttachRoleRequest) returns (AttachRoleResponse);
  rpc DetachRole(DetachRoleRequest) returns (DetachRoleResponse);
  // GetRole reads one role back whole, the brief included, which is the only way to audit what a
  // session running as it was told.
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);

  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // Job is declared intent the crew keeps. A caller writes it, and a controller makes reality
  // match it. Nothing here dispatches anything.
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc StopJob(StopJobRequest) returns (StopJobResponse);
  // What a workspace lets its sessions declare. The operator reads and sets these; a session may do
  // neither, because a caller that could raise its own ceiling has no ceiling.
  rpc GetWorkspaceLimits(GetWorkspaceLimitsRequest) returns (GetWorkspaceLimitsResponse);
  rpc SetWorkspaceLimits(SetWorkspaceLimitsRequest) returns (SetWorkspaceLimitsResponse);
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);

  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  // GetUsage adds up what every conversation in the crew has cost. It is a running total rather than
  // configuration, which is why it is not part of GetInfo.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  // GetHeadroom is the crew's last reading of the machine it runs on. It answers from that reading
  // and never from the daemon, so the header may ask it every second.
  rpc GetHeadroom(GetHeadroomRequest) returns (GetHeadroomResponse);
}
