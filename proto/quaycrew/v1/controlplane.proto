syntax = "proto3";

package quaycrew.v1;

import "google/protobuf/timestamp.proto";

// A workspace is the runtime unit of isolation. Created through this API, never stored in the repo.
message Workspace {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

// A channel attached to a workspace (for example a Telegram bot).
message Channel {
  string workspace = 1;
  string id = 2;
  string kind = 3;
}

// A project is a body of work inside a workspace. Threads happen inside a project, and share the
// context the project carries.
message Project {
  string id = 1;
  string workspace = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
}

// A session is one model thread inside a project. It carries its workspace too, denormalised from
// the project so a listing does not need a join; a project never moves workspace.
message Session {
  string id = 1;
  string workspace = 2;
  string thread_id = 3;
  string status = 4;
  // model_session_id is the underlying model thread id, used to resume the thread.
  string model_session_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string project = 8;
}

message CreateWorkspaceRequest {
  string name = 1;
}
message CreateWorkspaceResponse {
  Workspace workspace = 1;
}
message GetWorkspaceRequest {
  string id = 1;
}
message GetWorkspaceResponse {
  Workspace workspace = 1;
}
message ListWorkspacesRequest {}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}
message DeleteWorkspaceRequest {
  string id = 1;
}
message DeleteWorkspaceResponse {}

message CreateProjectRequest {
  string workspace = 1;
  string name = 2;
}
message CreateProjectResponse {
  Project project = 1;
}
message GetProjectRequest {
  string id = 1;
}
message GetProjectResponse {
  Project project = 1;
}
// ListProjectsRequest lists every project when workspace is empty, or one workspace's when set.
message ListProjectsRequest {
  string workspace = 1;
}
message ListProjectsResponse {
  repeated Project projects = 1;
}
message DeleteProjectRequest {
  string id = 1;
}
message DeleteProjectResponse {}

message AttachChannelRequest {
  string workspace = 1;
  string id = 2;
  string kind = 3;
}
message AttachChannelResponse {
  Channel channel = 1;
}

// SetSecretRequest carries a secret value that is stored in the secrets backend, never returned.
message SetSecretRequest {
  string workspace = 1;
  string key = 2;
  string value = 3;
}
message SetSecretResponse {}

// DispatchRequest starts a new thread (thread_id empty) or continues an existing one.
message DispatchRequest {
  string project = 1;
  string thread_id = 2;
  string text = 3;
}
message DispatchResponse {
  string session_id = 1;
  string thread_id = 2;
  string reply = 3;
}

// ListSessionsRequest filters by project when set, else by workspace when set, else lists all.
message ListSessionsRequest {
  string workspace = 1;
  string project = 2;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
}
message GetSessionRequest {
  string id = 1;
}
message GetSessionResponse {
  Session session = 1;
}
// AttachSessionRequest asks how to get inside a session's conversation.
message AttachSessionRequest {
  string id = 1;
}
// AttachSessionResponse describes the command that opens the conversation, and deliberately carries
// no credential: the operator's own environment supplies that.
message AttachSessionResponse {
  // sandbox is the container the session runs in.
  string sandbox = 1;
  // argv is the command to run inside it, for example ["claude", "--resume", "<conversation id>"].
  repeated string argv = 2;
}

message StopSessionRequest {
  string id = 1;
}
message StopSessionResponse {}

// GetInfoRequest asks what this control plane is running.
message GetInfoRequest {}
// GetInfoResponse says what a turn dispatched here would actually do.
//
// It carries configuration, never a secret and never a health verdict. The console shows it so the
// operator can see which crew they are about to act on, the way a cluster name does.
message GetInfoResponse {
  // model is the backend a turn runs against, for example "claude-code" or "echo".
  string model = 1;
  // sandbox is the isolation a session runs in, for example "docker" or "local".
  string sandbox = 2;
  // store is where workspaces and sessions are kept, for example "postgres" or "memory". A memory
  // store loses every workspace and session when the process restarts, which is worth seeing before
  // starting work rather than after.
  string store = 3;
  // state_kept is true when a session's conversation is kept outside its container, so replacing a
  // sandbox does not destroy the conversation.
  bool state_kept = 4;
}

// ControlPlane is the spine API. Channels feed the event log; the dashboard and CLI drive this.
service ControlPlaneService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  rpc AttachChannel(AttachChannelRequest) returns (AttachChannelResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);

  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc AttachSession(AttachSessionRequest) returns (AttachSessionResponse);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);

  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
}
