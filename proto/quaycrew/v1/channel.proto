syntax = "proto3";

// Package quaycrew.v1 holds the shared message contracts every service agrees on.
package quaycrew.v1;

// InboundMessage is published to the event log by a channel when it receives input.
// Every message is scoped to a workspace and carries a correlation id that equals the trace id.
message InboundMessage {
  // workspace is the isolation unit this message belongs to.
  string workspace = 1;
  // channel is the id of the channel that received the input (for example "cli", "telegram").
  string channel = 2;
  // sender is the channel specific identity of who sent it.
  string sender = 3;
  // text is the message body.
  string text = 4;
  // handle continues an existing session when set; empty starts a new one.
  string handle = 5;
  // correlation_id is unique per inbound message and is also used as the trace id.
  string correlation_id = 6;
  // received_at is when the channel received the input, in RFC 3339.
  string received_at = 7;
}

// OutboundMessage is delivered back to a channel as a reply.
message OutboundMessage {
  // workspace is the isolation unit this reply belongs to.
  string workspace = 1;
  // handle is the session the reply belongs to.
  string handle = 2;
  // text is the reply body.
  string text = 3;
  // correlation_id ties the reply back to the originating inbound message.
  string correlation_id = 4;
}
