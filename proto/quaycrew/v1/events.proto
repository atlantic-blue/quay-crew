syntax = "proto3";

// Package quaycrew.v1 holds the shared message contracts every service agrees on.
package quaycrew.v1;

import "google/protobuf/timestamp.proto";

// TaskEvent is written to the event log every time a task runs, whether it worked or not.
//
// This is the audit record: the store keeps the current state of a session, and the log keeps what
// happened to it, in order. A projection reads these back into a queryable read model, which is why
// the event carries enough to rebuild a conversation without reading anything else.
message TaskEvent {
  // id identifies this record. Delivery from the log is at least once, so a consumer sees the same
  // record more than once and needs something to recognise it by: the projection writes it as the
  // primary key and lets a repeat collide harmlessly.
  string id = 10;
  // session is the session the task ran in, and the key the record is published under, so one
  // session's events stay in order on one partition.
  string session = 1;
  // workspace and project are where the session sits, denormalised deliberately: a consumer must not
  // have to query the store to know what it is reading.
  string workspace = 2;
  string project = 3;
  // handle is the channel's own name for the conversation.
  string handle = 4;
  // prompt is what was asked. reply is what came back, empty when the task failed.
  string prompt = 5;
  string reply = 6;
  // status is the session's status after the task: "idle" when it worked, "failed" when it did not.
  string status = 7;
  // failure says what went wrong, empty on a task that worked. It is the operator's sentence, not a
  // stack trace, and it never carries the contents of the environment a task ran with.
  string failure = 8;
  // occurred_at is when the task finished.
  google.protobuf.Timestamp occurred_at = 9;
  // trace_id is the trace the call that ran this task belonged to, 32 hexadecimal characters, and
  // empty for a task nothing was tracing. It is the one value that joins this record to the trace
  // and to every log line written under it, because the system's correlation id is the trace id
  // rather than a second identifier beside it. Without it the durable record of what the system did
  // links to neither, and weeks later the logs are gone and the row is all that is left. See
  // issue 346.
  string trace_id = 11;
}

// SessionEvent is one thing that happened to a session, written every time it happens.
//
// This is what a consumer subscribes to, and what a workflow trigger matches on. It goes to the
// store in the same breath as the thing it describes, and to `<workspace>.sessions` after, keyed by
// session so one session's records stay in order on one partition.
message SessionEvent {
  // id identifies this record. Delivery from the log is at least once, so a consumer sees the same
  // record more than once and needs something to recognise it by.
  string id = 1;
  // kind is what happened, and it is the field a consumer switches on:
  //
  //   session.created    the session exists
  //   session.started    work began in it
  //   session.completed  the work landed, and detail carries the reply
  //   session.errored    the work did not land, and detail carries the reason
  //   session.stopped    the session was put down, and its container with it
  //   session.archived   it was put away
  //   session.restored   it was brought back
  //   session.deleted    it is gone, with the project or on its own
  //
  // A kind names something that happened, in the past tense, at one moment. "idle" and "running"
  // are not kinds: they are what the session's row says now, which is the fold of these.
  string kind = 2;
  // session is the session this happened to, and the key the record is published under.
  string session = 3;
  // workspace, project and handle are where the session sits, denormalised deliberately: a consumer
  // must not have to query the store to know what it is reading.
  string workspace = 4;
  string project = 5;
  string handle = 6;
  // detail is one short line about this event, empty on the kinds that need none. It carries what
  // the model replied and what a failure said, so it goes through the system's redactor first.
  string detail = 7;
  // occurred_at is when it happened.
  google.protobuf.Timestamp occurred_at = 8;
}

// JobEvent is one thing that happened to a job, written every time it happens.
//
// It goes to the `job_events` table in the same transaction as the row it describes, and to
// `<workspace>.job` after, keyed by the job identifier so one job's records stay in
// order on one partition. The store is the truth: a system with no broker keeps the whole history and
// loses only the export.
//
// The kinds split in two, and the split is the useful part. A dashboard counting jobs must not break
// because the system changed how it leases.
message JobEvent {
  // id identifies this record. Delivery from the log is at least once, so a consumer sees the same
  // record more than once and needs something to recognise it by. It is the same value as the row in
  // the `job_events` table.
  string id = 1;
  // kind is what happened, and it is the field a consumer switches on.
  //
  // The contract, which another service may depend on:
  //
  //   job.declared   somebody wrote the job down
  //   job.started    a controller sent its brief as a task
  //   job.answered   the answer landed and the claim held
  //   job.failed     the model did not finish, or the sandbox could not be made
  //   job.asked      it put a question to a person
  //   job.told       a person answered that question
  //   job.stopped    a person stopped it, or a limit did, or its claim did not hold
  //   job.looped     three attempts at one step were too alike to tell apart
  //
  // Internal, which nothing outside should depend on:
  //
  //   job.claimed    a controller took the row
  //   job.released   a controller's hold ran out and another took it
  //
  // A kind names something that happened, in the past tense, at one moment. A phase, "pending" or
  // "running", is what the row says now, which is the fold of these, so it is never a kind.
  string kind = 2;
  // job is the job this happened to, and the key the record is published under.
  string job = 3;
  // workspace, project, parent and depth are where the job sits in the tree, denormalised
  // deliberately: a consumer must not have to query the store to know what it is reading. parent is
  // empty for a root.
  string workspace = 4;
  string project = 5;
  string parent = 6;
  int32 depth = 7;
  // detail is one short line about this event: the title declared, the session and attempt, what it
  // spent, the reason it stopped. It can carry what a caller typed, so it goes through the system's
  // redactor before it is written or exported.
  string detail = 8;
  // trace_id is the trace the whole tree belongs to, minted at the root and inherited by every
  // descendant, so one identifier joins a job, its children, its tasks and its spans.
  string trace_id = 9;
  // occurred_at is when it happened.
  google.protobuf.Timestamp occurred_at = 10;
}
