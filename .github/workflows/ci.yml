name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Verify generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          buf generate
          git diff --exit-code -- gen

      - name: Buf lint
        run: buf lint

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: ./internal/... ./cmd/...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # testcontainers spins up Redpanda in Docker (available on the runner) to test the
      # messaging client and networking against a real broker.
      - name: Integration tests
        run: go test -tags=integration ./...

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build

      - name: Start the core stack
        run: docker compose -f deploy/docker-compose.yml up -d redpanda otel-collector gateway

      - name: Wait for Redpanda to be healthy
        run: |
          cid=$(docker compose -f deploy/docker-compose.yml ps -q redpanda)
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            echo "redpanda: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "redpanda did not become healthy"
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      - name: Check services are up and networked
        run: |
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs gateway
          # gateway must still be running (its telemetry init reached the collector over the network)
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f deploy/docker-compose.yml ps -q gateway)")" = "true"

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
