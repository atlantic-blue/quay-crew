name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Verify generated code is up to date
        run: |
          if find . -name '*.proto' 2>/dev/null | grep -q .; then
            go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
            go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
            export PATH="$PATH:$(go env GOPATH)/bin"
            buf generate
            git diff --exit-code -- gen
          else
            echo "no proto files yet, skipping"
          fi

      - name: Buf lint
        run: |
          if find . -name '*.proto' 2>/dev/null | grep -q .; then buf lint; else echo "no proto files yet, skipping"; fi

      - name: Build
        run: go build ./...

      # A hook ships as an executable, and its entry point is a build artifact rather than something
      # in the history. Anything that reads the hooks directory has to build it first, and the hook
      # loader refuses a hook whose entry point is not there.
      - name: Build the hooks
        run: make hooks

      - name: Vet
        run: go vet ./...

      # Each hook is its own module, so the sweep above does not reach it.
      - name: Vet the hooks
        run: |
          for dir in $(find hooks -maxdepth 2 -name go.mod -exec dirname {} \;); do
            go vet -C "$dir" ./...
          done

      # -count=1 so a run always executes. Go's build cache will happily report ok for a package it
      # has seen before, which turns a check that proves something into a check that proves it once.
      - name: Unit tests
        run: go test -count=1 ./...

      # Separate modules, so `go test ./...` above never sees them.
      - name: Hook tests
        run: |
          for dir in $(find hooks -maxdepth 2 -name go.mod -exec dirname {} \;); do
            go test -C "$dir" -count=1 ./...
          done

      # Run the behaviour specifications again on their own, verbosely, so the log reports what the
      # product does scenario by scenario rather than a single ok line.
      - name: Behaviour specifications
        run: go test ./features/... -v -count=1

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./internal/... ./cmd/... ./features/...
          for dir in $(find hooks -maxdepth 2 -name go.mod -exec dirname {} \;); do
            (cd "$dir" && "$(go env GOPATH)/bin/golangci-lint" run ./...)
          done

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The sandbox image, so the tests that need a container with git in it actually run. Without it
      # they skip, and a skipped test reads as a passing one: making a commit as the operator and git
      # finding its credential are the two things in here that only a real container can prove, and
      # both were running on one laptop and nowhere else.
      - name: Build the sandbox image
        run: make sandbox-image

      # The analyser test reads the shipped hooks off disk, and the loader refuses one whose entry
      # point is not there. Without this the test fails on a missing file rather than on the hook.
      - name: Build the hooks
        run: make hooks

      # testcontainers spins up Redpanda in Docker (available on the runner) to test the
      # messaging client and networking against a real broker.
      # Verbose, so the log names every test that ran and every test that skipped. Without it a
      # package reports one ok line, and a test that skipped itself because a variable was not set is
      # indistinguishable from one that did the work. That is exactly how the two analyser tests in
      # internal/sandbox went unrun for their whole life.
      - name: Integration tests
        env:
          QC_TEST_SANDBOX_IMAGE: quaycrew-sandbox-claude:local
        run: go test -tags=integration -count=1 -v ./...

  containers:
    runs-on: ubuntu-latest
    # An explicit compose workspace name so the stack's containers (qcci-controlplane-1, ...) do not
    # share the "quaycrew-" prefix the sandbox containers use, which would make the count below match
    # the whole stack. Without this the workspace defaults to the checkout directory ("quaycrew").
    env:
      COMPOSE_PROJECT_NAME: qcci
      # The network a sandbox joins to reach the control plane, named after this stack the way the
      # makefile names it. One variable creates the network and tells the control plane which one to
      # join a sandbox to, so the two cannot drift.
      QC_SESSION_NETWORK: qcci_sessions
    steps:
      - uses: actions/checkout@v4

      # Docker creates a missing bind mount source as root, and the crew's directory holds the files
      # the tool writes as well as the data the stack mounts. Made here, by this user, before compose
      # can make it as root.
      - name: Make the crew's directory
        run: mkdir -p "$HOME/.quay/data"

      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build

      # The whole stack, not a list of services. Naming them meant the observability containers were
      # never started here, so a change to them passed continuous integration without being run once.
      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Wait for Redpanda to be healthy
        run: |
          cid=$(docker compose -f deploy/docker-compose.yml ps -q redpanda)
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            echo "redpanda: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "redpanda did not become healthy"
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      - name: Check services are up and networked
        run: |
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs gateway controlplane
          # both services must still be running (they reached the collector, and Redpanda, over the network)
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f deploy/docker-compose.yml ps -q gateway)")" = "true"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f deploy/docker-compose.yml ps -q controlplane)")" = "true"

      # Every service the compose file defines has to be running, read from the file rather than from
      # a list written here: a list goes stale the moment somebody adds a service, and a service that
      # was never started looks exactly like one that started fine.
      - name: Every service in the compose file is running
        run: |
          set -euo pipefail
          services=$(docker compose -f deploy/docker-compose.yml config --services | sort)
          test -n "$services"
          echo "$services"
          for service in $services; do
            cid=$(docker compose -f deploy/docker-compose.yml ps -q "$service")
            if [ -z "$cid" ]; then
              echo "$service: never started"
              docker compose -f deploy/docker-compose.yml logs "$service" || true
              exit 1
            fi
            running=$(docker inspect -f '{{.State.Running}}' "$cid")
            echo "$service: running=$running"
            if [ "$running" != "true" ]; then
              docker compose -f deploy/docker-compose.yml logs "$service"
              exit 1
            fi
          done

      # Grafana comes up joined or it comes up empty, and the two look identical from outside. Ask it
      # what it holds, and require the three the repository provisions.
      - name: Grafana holds the data sources this repository provisions
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            found=$(curl -fsS http://localhost:3000/api/datasources 2>/dev/null || echo "")
            [ -n "$found" ] && break
            sleep 5
          done
          test -n "$found"
          echo "$found"
          for name in Tempo Prometheus Loki; do
            echo "$found" | grep -q "\"name\":\"$name\"" || { echo "grafana has no $name data source"; exit 1; }
          done

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The crew refuses a caller without its token. The control plane minted one on first start
      # into the data directory, owned by root because that container runs as root, so read it with
      # sudo and hand it to every later step through the job environment.
      - name: Read the crew's token
        run: |
          set -euo pipefail
          token_file="$HOME/.quay/data/crew.token"
          for i in $(seq 1 15); do
            sudo test -s "$token_file" && break
            sleep 2
          done
          sudo test -s "$token_file"
          token=$(sudo cat "$token_file")
          echo "::add-mask::$token"
          echo "QC_TOKEN=$token" >> "$GITHUB_ENV"

      # Pull it here rather than implicitly on the first `docker run`, so a registry hiccup reads as
      # a pull failure instead of a dispatch failure.
      - name: Pre-pull the sandbox image
        run: docker pull alpine:3.22

      # The point of this step: prove a task really runs. It goes through the gRPC API, creates a
      # session, starts a sandbox container on the host daemon, execs inside it, and returns the
      # reply. Only the model is substituted (QC_MODEL=echo in compose). Asserting the services are
      # merely running let a stack ship that could not execute a single task.
      - name: Dispatch a task end to end
        env:
          QC_GRPC_ADDR: localhost:50051
        run: |
          set -euo pipefail
          # Creating moves you into it, so the dispatch below needs no address at all: that is the
          # current context doing its job, in the composed stack rather than in a unit test.
          go run ./cmd/quay workspace create smoke
          go run ./cmd/quay project create bills
          test "$(go run ./cmd/quay use)" = "smoke/bills"

          out=$(go run ./cmd/quay task "hello from ci")
          echo "$out"
          test "$(printf '%s' "$out" | head -1)" = "hello from ci"

          # The task must have run inside a sandbox container, not in the control plane itself.
          test "$(docker ps --filter 'name=quaycrew-' --quiet | wc -l)" -eq 1

          # A second task on the same session reuses that one sandbox.
          handle=$(printf '%s' "$out" | sed -n 's/.*handle \([a-f0-9]*\))$/\1/p')
          test -n "$handle"
          go run ./cmd/quay task "smoke/bills/$handle" "second task" >/dev/null
          test "$(docker ps --filter 'name=quaycrew-' --quiet | wc -l)" -eq 1

      # The point of this step: prove a session can reach the crew and reach nothing else of it. The
      # session container above is on the network the compose file made, so the name the crew hands
      # out resolves inside it, and the store's does not.
      #
      # This is the half the tagged tests cannot prove. There the control plane listens on the host
      # and a session dials it by address; here it is a container on the same network, which is what
      # makes "controlplane:50051" mean anything at all. A sandbox handed that address and unable to
      # resolve it reported "produced zero addresses" and read as the crew being down.
      - name: A session resolves the crew and cannot resolve the store
        run: |
          set -euo pipefail
          sandbox=$(docker ps --filter 'name=quaycrew-' --format '{{.Names}}' | head -1)
          crew=$(docker compose -f deploy/docker-compose.yml ps -q controlplane)
          test -n "$sandbox" && test -n "$crew"
          echo "sandbox: $sandbox"

          # The daemon's view before any assertion, so a failure below is diagnosed from this run
          # rather than from the next one. An alias belongs to one network rather than to a container,
          # so what the crew answers to has to be read per network.
          echo "--- what each container is on ---"
          on() {
            docker inspect -f \
              '{{range $name, $end := .NetworkSettings.Networks}}{{$name}} aliases={{$end.Aliases}} address={{$end.IPAddress}}{{"\n"}}{{end}}' "$1"
          }
          on "$sandbox"
          on "$crew"
          echo "--- how the sandbox is told to resolve anything ---"
          docker exec "$sandbox" cat /etc/resolv.conf

          # Two lookups, both through getent, which is the ordinary path a program takes. The first
          # attempt at this step asked busybox nslookup, and it only ever queried the name with the
          # runner's search domain appended, so it reported NXDOMAIN for a name it never asked for.
          # A tool that cannot ask the question is not evidence about the answer, in either direction,
          # which is why the store is asked the same way as the crew.
          echo "--- what the crew's name resolves to, from inside the sandbox ---"
          # A missing tool answers nothing and reads exactly like a name that does not resolve, so it
          # is refused here by name rather than diagnosed as a network fault below.
          if ! docker exec "$sandbox" sh -c 'command -v getent' >/dev/null 2>&1; then
            echo "this sandbox image carries no getent, so this step cannot ask the question at all"
            exit 1
          fi
          address=$(docker exec "$sandbox" getent hosts controlplane | awk '{print $1}' | head -1)
          echo "controlplane: ${address:-nothing}"
          if [ -z "$address" ]; then
            echo "a session cannot resolve the name the crew handed it, so every call it makes fails here"
            docker exec "$sandbox" nslookup controlplane. || true
            exit 1
          fi

          # And the store, which is on the crew's own network and not on this one. The lookup above is
          # the control: the same command found the crew, so nothing here found the store rather than
          # nothing here works.
          if store=$(docker exec "$sandbox" getent hosts postgres); then
            echo "a session resolved the crew's store: $store"
            exit 1
          fi
          echo "postgres: unresolved, which is the boundary"

          # The same thing read from the daemon rather than from inside: one network, and it is the
          # sessions one. A second network here would be the widening this design exists to avoid.
          joined=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$sandbox")
          test "$(echo "$joined" | wc -w)" -eq 1
          test "$(echo "$joined" | tr -d ' ')" = "$QC_SESSION_NETWORK"

          # And the control plane is on both: the crew's own network for the store, the broker and the
          # collector, and the sessions network for the sandboxes.
          both=$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' "$crew")
          case "$both" in *"$QC_SESSION_NETWORK"*) ;; *) echo "the crew is not where its sessions are"; exit 1 ;; esac
          case "$both" in *qcci_default*) ;; *) echo "the crew left its own network, so it has no store"; exit 1 ;; esac

      # Tasks have now run, so the signals have to have moved. This is the check docs/OBSERVABILITY.md
      # tells an operator to run, and it is the one that was never automated: the stack could ship
      # emitting nothing and every other step here would still pass.
      - name: The tasks that just ran produced telemetry
        run: |
          set -euo pipefail
          # The debug exporter spells its summary differently by verbosity: "ResourceSpans" only at
          # detailed, "TracesExporter" and "resource spans" at normal. Match any of them rather than
          # pinning the check to one verbosity setting.
          marker='ResourceSpans|TracesExporter|resource spans'
          for i in $(seq 1 20); do
            spans=$(docker compose -f deploy/docker-compose.yml logs otel-collector 2>&1 | grep -cE "$marker" || true)
            [ "$spans" -gt 0 ] && break
            sleep 3
          done
          echo "collector logged $spans lines matching $marker"
          if [ "$spans" -eq 0 ]; then
            # Print what it did say, so the next person diagnoses this from one run rather than two.
            echo "--- the collector's whole log ---"
            docker compose -f deploy/docker-compose.yml logs otel-collector 2>&1 | tail -100
            echo "--- what the control plane says about its endpoint ---"
            docker compose -f deploy/docker-compose.yml logs controlplane 2>&1 | grep -iE "otel|telemetry|export" | tail -20 || true
            exit 1
          fi

      # Grafana reaching a store is the difference between a provisioned data source and a working
      # one, and the two look identical in the configuration file. Asked through Grafana's own proxy,
      # so this fails if either end is wrong.
      - name: Grafana can reach Tempo and Loki
        run: |
          set -euo pipefail
          # Loki answers /ready with 503 until its ingester has been ready for fifteen seconds, so one
          # request here fails against a store that is coming up correctly. Retry rather than ask
          # once. A store that never answers still fails the job, and brings its log with it.
          reach() {
            what=$1; url=$2; service=$3; body=""
            for i in $(seq 1 40); do
              if body=$(curl -fsS "$url" 2>&1); then
                echo "$what: $body"
                return 0
              fi
              sleep 3
            done
            echo "$what never answered: $body"
            docker compose -f deploy/docker-compose.yml logs "$service" 2>&1 | tail -50
            return 1
          }
          reach tempo "http://localhost:3000/api/datasources/proxy/uid/tempo/api/echo" tempo
          reach loki "http://localhost:3000/api/datasources/proxy/uid/loki/ready" loki
          reach prometheus "http://localhost:9090/-/ready" prometheus

      # The point of this step: prove a session is really durable. Restarting the control plane
      # throws away everything the process held, so anything still visible afterwards came back from
      # Postgres. Before this, a restart lost every workspace and orphaned every conversation.
      - name: A session survives a control plane restart
        env:
          QC_GRPC_ADDR: localhost:50051
        run: |
          set -euo pipefail
          workspace=$(go run ./cmd/quay workspace create durable | sed -n 's/created workspace \([a-f0-9]*\).*/\1/p')
          test -n "$workspace"
          go run ./cmd/quay project create bills
          out=$(go run ./cmd/quay task "remember this")
          session=$(printf '%s' "$out" | sed -n 's/.*(session \([a-f0-9]*\),.*/\1/p')
          test -n "$session"

          docker compose -f deploy/docker-compose.yml restart controlplane
          for i in $(seq 1 30); do
            go run ./cmd/quay workspace list >/dev/null 2>&1 && break
            sleep 2
          done

          # Capture before matching. Under pipefail a `grep -q` closes the pipe on its first match,
          # which hands the writer a broken pipe and fails the step for the wrong reason.
          workspaces=$(go run ./cmd/quay workspace list)
          sessions=$(go run ./cmd/quay sessions durable/bills)
          echo "$workspaces"
          echo "$sessions"

          # The workspace is still there.
          case "$workspaces" in *"$workspace"*) ;; *) echo "the workspace did not survive the restart"; exit 1 ;; esac
          # And so is the session, exactly one of it. The listing shortens identifiers for a human,
          # so match the prefix it prints rather than the whole session id. By column rather than by
          # substring: a shortened identifier is eight hex characters that could turn up in more than
          # one column. Column one is the session column, which is the identifier every command takes
          # and the only one a listing prints.
          test "$(printf '%s\n' "$sessions" | awk -v want="${session:0:8}" 'NR > 1 && $1 == want' | wc -l)" -eq 1

          # Dispatching a task after the restart is deliberately not asserted here. The control plane
          # forgets which container each session was running in, so it tries to start a second one
          # with the same name and the daemon refuses. Reattaching is issue #35, and the assertion
          # belongs in that change.

      # The point of this step: prove a session's own state outlives its container. The conversation
      # the model keeps lives inside the sandbox, and stopping a session removes that container, so
      # before this the database's handle pointed at something that had been deleted. The state is
      # now mounted in from the host, and this destroys the container to prove it.
      - name: A session's state survives its sandbox container
        env:
          QC_GRPC_ADDR: localhost:50051
        run: |
          set -euo pipefail
          go run ./cmd/quay workspace create durable-state
          go run ./cmd/quay project create bills
          out=$(go run ./cmd/quay task "first task")
          session=$(printf '%s' "$out" | sed -n 's/.*session \([a-f0-9]*\),.*/\1/p')
          handle=$(printf '%s' "$out" | sed -n 's/.*handle \([a-f0-9]*\))$/\1/p')
          test -n "$session" && test -n "$handle"

          # Stand in for what the model writes into its own conversation store, and for a note
          # something inside the sandbox writes into its own memory.
          docker exec "quaycrew-$session" sh -c 'echo remembered > /home/agent/.claude/note'
          docker exec "quaycrew-$session" sh -c 'echo "the bills project" >> /home/agent/workspace/CLAUDE.md'

          # Destroy the container, exactly as stopping a session does, and restart the control plane
          # so it does not hold a handle to something that no longer exists.
          docker rm -f "quaycrew-$session"
          docker compose -f deploy/docker-compose.yml restart controlplane
          for i in $(seq 1 30); do
            go run ./cmd/quay workspace list >/dev/null 2>&1 && break
            sleep 2
          done

          go run ./cmd/quay task "durable-state/bills/$handle" "second task" >/dev/null
          kept=$(docker exec "quaycrew-$session" cat /home/agent/.claude/note)
          context=$(docker exec "quaycrew-$session" cat /home/agent/workspace/CLAUDE.md)
          echo "conversation store: $kept"
          echo "session memory:"
          echo "$context"
          test "$kept" = "remembered"

          # The note survived the container, and it came back filed under the session: a note written
          # from inside is about the work in hand, not about the whole crew.
          case "$context" in
            *"the bills project"*) ;;
            *) echo "the note written inside the sandbox did not survive"; exit 1 ;;
          esac
          case "$context" in
            *"quay:session"*) ;;
            *) echo "the note came back without a level, so nothing knows where it belongs"; exit 1 ;;
          esac

      - name: Sandbox logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs controlplane

      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down -v
          # Sandboxes outlive the control plane today; see issue #35.
          docker rm -f $(docker ps -aq --filter 'name=quaycrew-') 2>/dev/null || true


  # A change that touches behaviour carries a changelog entry and a scenario, or says in the pull
  # request body why it has neither. Everything above proves the code runs; nothing above knows this
  # repository promises a reader an entry in CHANGELOG.md and a scenario in features/ for every
  # behaviour, so that promise held for exactly as long as whoever opened the pull request remembered
  # it. One change shipped 200 lines of new behaviour with neither and all four jobs were green.
  #
  # Only on a pull request, because there is no body to read anywhere else and no way to say why a
  # change has none.
  promises:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the ref the change was cut from is here to be diffed against. A shallow
      # checkout holds the pull request's own commits and not the base, and the check would refuse
      # every change for a range it cannot read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # actions/checkout fetches the ref being built, not the one it is merging into, so the base is
      # asked for by name here.
      - name: Fetch the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      # The body goes through the environment and into a file rather than into the command line. A
      # body is somebody's prose, and a run step that interpolates it directly runs whatever it says.
      - name: A change carries a scenario and a changelog entry
        env:
          BASE: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request-body.md"
          go run ./cmd/promises -base "origin/$BASE" -body "$RUNNER_TEMP/pull-request-body.md"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary is free; only the GitHub Action requires a licence for org repos.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --verbose
