# The terminal an open conversation runs in, so the operator can leave without ending it.
#
# Two prefixes, because this one is very often nested. Opening a session from inside the operator's own
# tmux means ctrl-b is eaten by the outer server and never reaches this one, so ctrl-space is the
# prefix that always lands here and ctrl-b stays as the second for when nothing is nested.
#
# The prefix must not be a control character the terminal itself reserves. On macOS ^O is DISCARD, so
# the line discipline swallows it and no application ever sees it, which is exactly what happened when
# this was ctrl-o. internal/sandbox holds a test over this file that refuses the whole set.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# And ctrl-q on its own, no prefix, because leaving a conversation is the one thing worth a single
# keystroke. ^Q is the terminal's "start output" character, so open-conversation tasks that off before
# anything runs; without that the line discipline eats it and this binding never fires, which is
# exactly how ctrl-o failed.
bind -n C-q detach-client

# One line, saying the only thing anybody needs from it: how to get out without ending what is running.
# It was off, on the reasoning that this is not a terminal anybody is meant to manage. That left the
# operator inside a conversation with nothing on screen telling them how to leave, so they pressed
# ctrl-d twice, which ends the conversation and everything it was in the middle of.
set -g status on
set -g status-style "bg=colour236 fg=colour250"
set -g status-left ""
set -g status-right ""
set -g status-justify centre
set -g window-status-current-format " ctrl-q leaves this running and goes back to quay "
set -g window-status-format " ctrl-q leaves this running and goes back to quay "
set -g mouse on
