# OpenTelemetry collector for local development. It accepts OTLP over gRPC and forwards each signal
# to the service that stores it, keeping the debug exporter beside them so the collector's own log
# stays the fastest way to tell whether anything is arriving at all.
#
# Tempo, Loki and Prometheus are in the compose file's "observability" profile and the collector is
# not, so a plain `make up` runs this with nowhere to forward to. That is deliberate: the crew is
# usable without four extra containers on a laptop. The queue and the retry are therefore turned off
# on the exporters that leave this machine, so a batch that cannot be delivered is dropped with one
# line rather than being held and retried forever. Start the profile with `make up-observability` and
# delivery starts working with no change here.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false
  # Prometheus pulls rather than being pushed to, so this is an endpoint it scrapes and not an
  # address it listens on. deploy/prometheus.yaml is the other half.
  prometheus:
    endpoint: 0.0.0.0:8889
  # Loki takes OTLP directly on this path, so there is no Loki specific exporter and no second
  # format to keep working. Dropped rather than retried for the same reason as Tempo above: with the
  # observability profile off there is nothing here to deliver to.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
