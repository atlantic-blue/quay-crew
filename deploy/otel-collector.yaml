# OpenTelemetry collector for local development. It accepts OTLP over gRPC and forwards each signal
# to the service that stores it, keeping the debug exporter beside them so the collector's own log
# stays the fastest way to tell whether anything is arriving at all.
#
# Tempo, Loki and Prometheus start with the rest of the stack, so the queue and the retry are left on:
# a batch that arrives while a store is still coming up is held and delivered rather than dropped.
# They were off while those three sat behind a profile, because there was nothing to deliver to.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus pulls rather than being pushed to, so this is an endpoint it scrapes and not an
  # address it listens on. deploy/prometheus.yaml is the other half.
  prometheus:
    endpoint: 0.0.0.0:8889
  # Loki takes OTLP directly on this path, so there is no Loki specific exporter and no second format
  # to keep working.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
