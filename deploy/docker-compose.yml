name: quaycrew

services:
  # The audit export's broker. History lives in Postgres either way; this is the copy a second
  # consumer reads, and it starts with everything else so the export is on rather than waiting to be
  # switched on.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quaycrew
      POSTGRES_USER: quaycrew
      # Local development only. Every deployed environment supplies this from its secrets backend.
      POSTGRES_PASSWORD: ${QC_POSTGRES_PASSWORD:-quaycrew}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quaycrew -d quaycrew"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE: gateway
    environment:
      QC_SERVICE_NAME: gateway
      QC_OTEL_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  controlplane:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime-docker
      args:
        SERVICE: controlplane
        # Which build this crew is, so the tool can say when it and the crew are different builds.
        # The up target passes the commit; anything else builds a crew that says "dev".
        QC_VERSION: ${QC_VERSION:-dev}
    environment:
      QC_SERVICE_NAME: controlplane
      QC_OTEL_ENDPOINT: otel-collector:4317
      QC_GRPC_ADDR: ":50051"
      # Workspaces and sessions live here, so a restart resumes conversations instead of orphaning
      # them. Unset it and the control plane falls back to an in memory store and says so.
      QC_DATABASE_URL: postgres://quaycrew:${QC_POSTGRES_PASSWORD:-quaycrew}@postgres:5432/quaycrew?sslmode=disable
      # Each session gets its own container on the host daemon, a sibling of this one.
      QC_SANDBOX: docker
      QC_SANDBOX_IMAGE: ${QC_SANDBOX_IMAGE:-alpine:3.22}
      # The crew's own network, which only the driver joins. It carries Postgres, Redpanda and the
      # observability stack as well as this service, so it is a real widening and it stays off unless
      # the operator asks for it. Unset puts the driver on the session network below.
      QC_SANDBOX_NETWORK: ${QC_SANDBOX_NETWORK:-}
      # The network every sandbox joins, and the address it dials to reach this control plane. The
      # name is the same variable the network below is created under, so what compose makes and what
      # this service asks the daemon for cannot drift.
      #
      # A session can address this service and nothing else of the crew's. It may still do nothing
      # here: every call is refused until the session presents the credential the crew minted for the
      # job it is running, and that credential carries the verbs its role declared.
      QC_SESSION_NETWORK: ${QC_SESSION_NETWORK:-quaycrew_sessions}
      QC_SANDBOX_CONTROL_PLANE: ${QC_SANDBOX_CONTROL_PLANE:-controlplane:50051}
      # What the crew keeps back for its own containers before it admits any sandbox: mebibytes, and
      # per cent of one processor. The control plane, the database and the event log run in the same
      # runtime the work fills, so a crew that reserves nothing goes down with its own workload.
      # Unset takes the crew's own floor. Measure what to put here with, on the machine the crew runs
      # on and with no jobs running:
      #   docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' | grep -v quaycrew-
      QC_CREW_RESERVE_MEMORY: ${QC_CREW_RESERVE_MEMORY:-}
      QC_CREW_RESERVE_PROCESSOR: ${QC_CREW_RESERVE_PROCESSOR:-}
      # How much memory one session may take, as the daemon spells it, for example 4g. Unset gives
      # a session no limit, so it advertises the whole machine to node, Go, jest and webpack, and
      # the kernel kills them against whatever the rest of the machine has left.
      QC_SANDBOX_MEMORY: ${QC_SANDBOX_MEMORY:-}
      # Host paths only the driver gets, so it has something to bring to the crew.
      QC_DRIVER_MOUNTS: ${QC_DRIVER_MOUNTS:-}
      # Who a commit made inside a sandbox is by. Both or neither: git refuses on either missing.
      # The skills a session is given: this container's view of the directory, and the host's, which
      # is what a bind mount needs. Unset and a session is given none.
      # The data directory already carries the crew's own state, and the skills sit beside it, so both
      # views of it come from the mapping above: /var/lib/quaycrew in here, the host's path outside.
      # The skills this build ships with, carried in the image. A crew whose catalogue is empty is
      # given them on startup; a crew that already holds any is left exactly as the operator left it.
      QC_SEED_SKILLS_DIR: /skills
      QC_SKILLS_DIR: /var/lib/quaycrew/skills
      QC_SKILLS_HOST: ${QC_DATA_HOST:-${HOME}/.quay/data}/skills
      QC_GIT_AUTHOR_NAME: ${QC_GIT_AUTHOR_NAME:-}
      QC_GIT_AUTHOR_EMAIL: ${QC_GIT_AUTHOR_EMAIL:-}
      # The sandbox image above carries no model. Set QC_MODEL=claude-code once an image with the
      # Claude Code CLI and its credentials is in place.
      QC_MODEL: ${QC_MODEL:-echo}
      # Which model that backend runs against. The default is here rather than in the code so a crew
      # whose configuration file was written before this key existed still gets it, and so raising a
      # generation is one edit in one place. A full name rather than the "opus" alias, for the same
      # reason the command line tool itself is pinned: an alias moves on its own and nothing records
      # that it did.
      QC_CLAUDE_MODEL: ${QC_CLAUDE_MODEL:-claude-opus-5}
      # What a session's tasks may do when it is born: plan, edits or dangerous. Unset keeps edits,
      # which is what every session had before this was configurable.
      QC_PERMISSION_MODE: ${QC_PERMISSION_MODE:-}
      # How many tasks past its description a conversation goes before the crew writes it again.
      # "off" tasks it off, which a crew paying for automation runs wants.
      QC_DESCRIBE_EVERY: ${QC_DESCRIBE_EVERY:-}
      # How long the job controller holds a job before another controller may take it.
      # Unset takes the measured default, which is a minute.
      QC_JOB_LEASE: ${QC_JOB_LEASE:-}
      # The name it had before declared intent was called a job. Forwarded so a configuration file
      # written before the rename keeps the lease the operator chose, and the control plane says on
      # startup that the line should be renamed. Compose fills a key nobody set with an empty string,
      # which reads here as nothing to fall back to.
      QC_WORK_LEASE: ${QC_WORK_LEASE:-}
      # A workspace's conversation store and a project's files live here, on the host, rather than
      # inside the sandbox container, so replacing a container does not destroy the conversation the
      # database holds a handle to. QC_DATA_DIR is this container's view of the directory, the one it
      # creates folders in. QC_DATA_HOST is the same directory as the host daemon sees it, which is
      # what a sandbox, a sibling container on that daemon, can actually mount.
      QC_DATA_DIR: /var/lib/quaycrew
      QC_DATA_HOST: ${QC_DATA_HOST:-${HOME}/.quay/data}
      # The audit export. History is written to Postgres in the same breath as each task either way;
      # this also puts every task on <workspace>.tasks for a second consumer. Set it to empty in your
      # own configuration to turn the export off, which loses nothing.
      QC_KAFKA_SEEDS: ${QC_KAFKA_SEEDS-redpanda:9092}
    # Both networks. The default one is where the store, the broker and the collector are, and the
    # sessions one is where the sandboxes are. This service is the only thing on both, which is what
    # makes it the only thing a session can reach.
    #
    # The alias is written down rather than left to the default, because it is the name in
    # QC_SANDBOX_CONTROL_PLANE above and a session has nothing else to dial. An alias belongs to one
    # network rather than to a container, so the name a service answers to is a per network fact, and
    # this is the network where being wrong means every call a session makes fails to resolve.
    networks:
      default: {}
      sessions:
        aliases:
          - controlplane
    volumes:
      # The control plane starts sandbox containers through the host daemon. This is root equivalent
      # access to the host, granted deliberately: see docs/ARCHITECTURE.md.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${QC_DATA_HOST:-${HOME}/.quay/data}:/var/lib/quaycrew
    ports:
      # Loopback only: the port is the whole crew, and the token guards a caller, not the network.
      # Publish it wider only behind transport you own.
      - "127.0.0.1:50051:50051"
    # The crew is asked to write, not merely to answer. A control plane that served every listing and
    # started no work read as healthy for an hour, so this asks the one question that told the two
    # apart. The image carries no shell, so the check is the service binary in its other mode.
    healthcheck:
      test: ["CMD", "/service", "health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy

  # Where the three signals are kept and read. These start with everything else: a crew whose traces
  # go nowhere and whose dashboard is not running is a crew you cannot see, and remembering a second
  # command is not a job for a person.
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    # Provisioned rather than added by hand, so every operator's Grafana is the same one.
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    # The image ships no default config, so without this mount the container exits on startup and the
    # stack comes up one service short.
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    # Without this it falls back to the image default and scrapes only itself, which looks like a
    # working Prometheus and holds none of the crew's numbers.
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  redpanda-data:
  postgres-data:
  tempo-data:
  loki-data:

networks:
  # The crew's own network. Every service here is on it, and no session is.
  default:
  # Where a session reaches the control plane. The control plane is the only service on it, so a
  # session can address the crew and cannot address the store, the broker or the dashboards.
  #
  # Named rather than left to compose, because the control plane has to tell the daemon which network
  # to put each sandbox on and it reads that name from the same variable. Two spellings of one name is
  # how a session ends up on a network the crew is not on.
  sessions:
    name: ${QC_SESSION_NETWORK:-quaycrew_sessions}
