name: quaycrew

services:
  # The audit export's broker. Started only with: docker compose --profile export up. History lives
  # in Postgres either way; this exists for a second consumer (a dashboard, a pipeline, another
  # machine), and a crew that has none needs no broker at all.
  redpanda:
    profiles: ["export"]
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quaycrew
      POSTGRES_USER: quaycrew
      # Local development only. Every deployed environment supplies this from its secrets backend.
      POSTGRES_PASSWORD: ${QC_POSTGRES_PASSWORD:-quaycrew}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quaycrew -d quaycrew"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE: gateway
    environment:
      QC_SERVICE_NAME: gateway
      QC_OTEL_ENDPOINT: otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started

  controlplane:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime-docker
      args:
        SERVICE: controlplane
    environment:
      QC_SERVICE_NAME: controlplane
      QC_OTEL_ENDPOINT: otel-collector:4317
      QC_GRPC_ADDR: ":50051"
      # Workspaces and sessions live here, so a restart resumes conversations instead of orphaning
      # them. Unset it and the control plane falls back to an in memory store and says so.
      QC_DATABASE_URL: postgres://quaycrew:${QC_POSTGRES_PASSWORD:-quaycrew}@postgres:5432/quaycrew?sslmode=disable
      # Each session gets its own container on the host daemon, a sibling of this one.
      QC_SANDBOX: docker
      QC_SANDBOX_IMAGE: ${QC_SANDBOX_IMAGE:-alpine:3.22}
      # The network a session's sandbox joins, and the address it dials to reach this control plane.
      # Together they are what lets a session drive the crew: `quay` inside a sandbox then reaches the
      # same interface the operator's does. Unset either and it cannot, which is the default.
      QC_SANDBOX_NETWORK: ${QC_SANDBOX_NETWORK:-}
      QC_SANDBOX_CONTROL_PLANE: ${QC_SANDBOX_CONTROL_PLANE:-}
      # Host paths only the driver gets, so it has something to bring to the crew.
      QC_DRIVER_MOUNTS: ${QC_DRIVER_MOUNTS:-}
      # Which of a workspace's secrets a session's sandbox is given, by name. The model's own token
      # is always carried. Everything else is named here or it does not travel.
      QC_SANDBOX_SECRETS: ${QC_SANDBOX_SECRETS:-}
      # Who a commit made inside a sandbox is by. Both or neither: git refuses on either missing.
      # The skills a session is given: this container's view of the directory, and the host's, which
      # is what a bind mount needs. Unset and a session is given none.
      # The data directory already carries the crew's own state, and the skills sit beside it, so both
      # views of it come from the mapping above: /var/lib/quaycrew in here, the host's path outside.
      QC_SKILLS_DIR: /var/lib/quaycrew/skills
      QC_SKILLS_HOST: ${QC_DATA_HOST:-${HOME}/.quaycrew/data}/skills
      QC_GIT_AUTHOR_NAME: ${QC_GIT_AUTHOR_NAME:-}
      QC_GIT_AUTHOR_EMAIL: ${QC_GIT_AUTHOR_EMAIL:-}
      # The sandbox image above carries no model. Set QC_MODEL=claude-code once an image with the
      # Claude Code CLI and its credentials is in place.
      QC_MODEL: ${QC_MODEL:-echo}
      # A workspace's conversation store and a project's files live here, on the host, rather than
      # inside the sandbox container, so replacing a container does not destroy the conversation the
      # database holds a handle to. QC_DATA_DIR is this container's view of the directory, the one it
      # creates folders in. QC_DATA_HOST is the same directory as the host daemon sees it, which is
      # what a sandbox, a sibling container on that daemon, can actually mount.
      QC_DATA_DIR: /var/lib/quaycrew
      QC_DATA_HOST: ${QC_DATA_HOST:-${HOME}/.quaycrew/data}
      # The audit export. History is written to Postgres in the same breath as each turn either
      # way; set this (redpanda:9092 with the export profile up) and every turn is also exported to
      # <workspace>.turns for a second consumer. Unset, nothing is exported and nothing is lost.
      QC_KAFKA_SEEDS: ${QC_KAFKA_SEEDS:-}
    volumes:
      # The control plane starts sandbox containers through the host daemon. This is root equivalent
      # access to the host, granted deliberately: see docs/ARCHITECTURE.md.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${QC_DATA_HOST:-${HOME}/.quaycrew/data}:/var/lib/quaycrew
    ports:
      # Loopback only: the port is the whole crew, and the token guards a caller, not the network.
      # Publish it wider only behind transport you own.
      - "127.0.0.1:50051:50051"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy

  # Observability stack. Started only with: make up-observability
  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.2.0
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.6.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    # The image ships no default config, so without this mount the container exits on startup and the
    # profile comes up one service short.
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]

volumes:
  redpanda-data:
  postgres-data:
  tempo-data:
  loki-data:
