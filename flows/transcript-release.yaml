# The release flow of the acceptance project, described in docs/ACCEPTANCE-PROJECT.md section 8.
#
# It exercises every node type this engine has against real work: a dispatch that runs the gates, a
# choice that branches on what the dispatch replied, an ask that stops for a person, a wait that
# survives the crew being restarted underneath it, and a dispatch that reads the checks afterwards.
#
# It runs in dangerous mode because the gate steps run the repository's own commands and the release
# step pushes. Read that line before importing this into a workspace of your own.
name: transcript-release
version: 1
mode: dangerous
nodes:
  gates:
    type: dispatch
    prompt: >-
      You are in the transcript repository. Run every gate the repository declares: the formatter,
      the linter, the type check and the whole test suite, the way the pipeline runs them. Run the
      gate and read its result before doing anything else; never join a gate and another command
      with a semicolon. Never pipe a gate through tail or grep and then read the exit code,
      because a pipeline exits with the status of its last command. Write one line per gate to
      gates.md in your working directory: the command, the exit status, and the counts it printed.
      A run that reports zero tests is a failure, not a pass. Then reply with exactly one word and
      nothing else: passed if every gate passed and the test count was above zero, failed
      otherwise.
    expect:
      file: gates.md
  passed:
    type: choice
    on:
      result.reply: "passed"
  fixed:
    type: dispatch
    prompt: >-
      A gate failed. Read gates.md, find the failure, read the log it names, and fix the cause.
      Do not weaken a test and do not delete an assertion to make a gate pass. Then run every gate
      again, reading each result before the next command. Write what you changed and what the
      gates said afterwards to fix.md in your working directory. Reply with exactly one word and
      nothing else: passed if every gate now passes with a test count above zero, failed
      otherwise.
    expect:
      file: fix.md
  repassed:
    type: choice
    on:
      result.reply: "passed"
  stuck:
    type: dispatch
    prompt: >-
      The gates still fail after one attempt at a fix. Change nothing further. Read fix.md and
      gates.md, and write to stuck.md in your working directory what fails, the log line that
      says so, and what you would need in order to fix it.
    expect:
      file: stuck.md
  question:
    type: ask
    text: "A video carries captions only in a language the reader did not ask for. Does the page show them, or say there is nothing to show?"
  release:
    type: dispatch
    prompt: >-
      The operator answered this question: a video carries captions only in a language the reader
      did not ask for, does the page show them or say there is nothing to show. Their answer was:
      {{answer}}. Write that behaviour into the page, and write the decision and its reason into
      the repository so the next reader finds it. Then read the diff, stage the files by name,
      commit with a subject line only, push the branch, and open the pull request. Its description
      is what changed and why, in two to five sentences. Never stage everything at once. Never add
      an assistant attribution line. Never merge it. Write the branch name and the full pull
      request address to release.md in your working directory.
    expect:
      file: release.md
  land:
    type: wait
    for: 8m
  checks:
    type: dispatch
    prompt: >-
      Read the checks on the pull request named in release.md. Read each check description, not
      only its colour, because a check that skipped or was rate limited reports success and did
      nothing. Confirm the checks you expect are actually present; an absent check reads exactly
      like a passing one. Write one line per check to checks.md in your working directory: the
      name, the conclusion, and the run address.
    expect:
      file: checks.md
edges:
  - [gates, passed]
  - [passed, question, "true"]
  - [passed, fixed, "false"]
  - [fixed, repassed]
  - [repassed, question, "true"]
  - [repassed, stuck, "false"]
  - [stuck, done]
  - [question, release]
  - [release, land]
  - [land, checks]
  - [checks, done]
