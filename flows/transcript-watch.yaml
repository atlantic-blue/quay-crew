# The scheduled read of the acceptance project, described in docs/ACCEPTANCE-PROJECT.md section 8.
#
# It is the smallest useful automation shape: read the deployed thing through the address a reader
# uses, branch on whether it answered, and write what is missing when it did not. It reports and it
# never repairs, which is why it runs in edits mode rather than dangerous.
#
# Every fifteen minutes is the shortest schedule the crew accepts, flow.MinimumEvery in
# internal/flow/graph.go. A page that serves stored text from a cache does not need a faster one.
name: transcript-watch
version: 1
mode: edits
on:
  every: 15m
nodes:
  read:
    type: dispatch
    prompt: >-
      Read the deployed transcript page for video id gyN9lV9QgyA through its public address, the
      one served by the distribution and not an origin. Do not read a local file and do not read
      the store directly; the point is whether a reader gets text. Write to watch.md in your
      working directory: the address you read, the status code, the number of characters of
      transcript text on the page, and the first sixty characters of that text. Then reply with
      exactly one word and nothing else: served if the page returned text, missing otherwise.
    expect:
      file: watch.md
  alive:
    type: choice
    on:
      result.reply: "served"
  report:
    type: dispatch
    prompt: >-
      The page did not serve the transcript. Read watch.md for what came back. Say what is
      missing and where the request stopped: the edge, the function, or the store. Write it to
      outage.md in your working directory. Change nothing.
    expect:
      file: outage.md
edges:
  - [read, alive]
  - [alive, done, "true"]
  - [alive, report, "false"]
  - [report, done]
